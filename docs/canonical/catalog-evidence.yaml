# Declarative implementation evidence for catalog families.
#
# Schema:
#   <catalog source path>:
#     <layer>:
#       status: covered | not_applicable
#       evidence: "<honest human-readable evidence or not_applicable reason>"
#       files: ["repo/path.ts"]        # optional implementation citations
#       tests: ["repo/path.test.ts"]   # optional verification citations
#     unit_types:                      # optional scopes for mixed catalogs
#       <unit_type>:
#         ref_pattern: "^entries\\.\\d+$"  # optional; matches sources[].ref for this catalog
#         <layer>:
#           status: covered | not_applicable
#           evidence: "<same layer schema as above>"
#
# Family evidence applies to units whose sources[].path equals the catalog path.
# Top-level layers apply to every matching unit. unit_types layers apply only to
# matching unit_type rows, and ref_pattern narrows that unit_type scope by source ref.
# Unit-level rule-evidence.yaml entries still override these family layers.
#
# Rules:
# - Do not declare partial here. Absence means "still pending" in the generated matrix.
# - Unknown catalog paths, unit_type scopes with zero matches, unknown layers, and unknown
#   evidence fields are generator errors.
# - Declare covered only when the cited implementation is true for every unit in the scope.

