    prose: >-
      Les Dryades sont les nymphes des arbres. Généralement celles-ci se promène dans les foret sans plus d’objectif que
      d’admirer la beauté du monde. Souvent liées aux chênes, les nymphes ont des rapports étroits avec les arbres avec
      qui elles parle et établissent une relation de défense mutuel. Il est encore à noter que les Dryades sont toujours
      de sexe féminin et que celles-ci sont capables (selon les légendes) de se transformer en arbre.
