    prose: >-
      Contrairement à une idée répandue, les Elfes sombres ne possèdent pas forcément tous une peau noire mais tiennent
      plus leur nom de la noirceur de leurs pensées et de la tristesse de leur cœur. Suite au destin tragique de cette
      race, il est dit aujourd’hui que ces êtres ne peuvent pas pleurer. Ceux que l’on nomme aussi les Elfes noirs sont
      connus pour leur totale absence de sentiments envers les étrangers à leur race. Le simple fait d’en voir un est un
      présage de la plus mauvaise augure et la peur qu’il engendre n’a d’égal que la haine qu’il attise envers ses
      frères de l’Ouest.
