      - Vision nocturne
    prose: >-
      Les Elfes des Bois, aussi appelés Elfes de Tyrkan, vivent en harmonie avec la nature. Leur vie sont basées sur la
      philosophie de l’équilibre, car le paradoxe de l’existence est que la lumière ne pourrait exister sans son
      contraire, l’ombre. Quelque part entre tout acte, toute parole et toute pensée, se trouve un point d’équilibre.
      Les Elfes des bois, eux, l’ont trouvé et conservent précieusement ce savoir que les plus sages ont développé.
      Renommée Les Elfes des bois sont connus pour leurs philosophes et leurs archers qui sont les meilleurs des Terres
      Oubliées.
