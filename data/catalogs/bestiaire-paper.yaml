    prose: >-
      Le cheval est la plus belle conquête de l’homme. Animal fière et endurant, ceux-ci aides principalement au
      transport. Ils sont également un symbol de richesse pour celui qui en possède. Vol de Chevaux Les chevaux étant
      très cher, le vol de cheval à pendant longtemps été considéré comme un délit de la plus haute importance. Cheval
      ou Mulet? La plupart des gens ne pouvant se permettre d’acquérir un cheval, dans la grande majorité des cas,
      ceux-ci était remplacé par des mulets.
