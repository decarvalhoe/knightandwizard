    prose: "Les Canidae ou «\_Hommes-loup\_» (ou encore «\_Hommes-chien\_») sont un mélange d’humain le plus souvent mêlé à une race cannine. Leur endurance et leur flaire incroyable n’ont d’égale que leur sens aiguisé du combat et de la chasse. La communauté des Canidaes est faiblement représentée étant donné les rivalités meurtrières et incessantes entre les différentes meutes. Vivant généralement à l’orée de foret de plaines karstiques et s’abritant dans de nombreuses grottes caractéristiques de leur habitat naturel, il est rare de voir des Canidae se sédentariser, même si la naissance de villages aux allure de campement militaire n’est pas exclue. Les Gnolls Mélange d’homme et de hyène, les Gnolls sont une sous espèce de canidae connu notamment pour leurs rires compulsifs et fréquents."
