      Les Hauts-Elfes ont bâti des citées blanches utopiques. Celles-ci sont considérées comme un avant-poste du paradis
      par certains. Baignées dans le calme, la sagesse, on n’y trouve ni violence, ni mauvaises intentions. De hautes
