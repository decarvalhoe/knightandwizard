    prose: >-
      Les Elfes de Nacre tiennent leur nom de la pâleur de leur teint qui bien souvent contraste très fortement avec
      leur cheveux noirs comme la nuit. De tous les peuples, celui-ci est reconnu pour être le plus cruel. La drogue et
      les piercing sont chez eux monnaie courante. Leur présence à elle seule, lors d’un combat, suffit parfois à faire
      fuir ceux qui douteraient de leur victoire, car les Elfes blancs tâchent de faire le plus de prisonniers possible…
