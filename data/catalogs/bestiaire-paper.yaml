    prose: >-
      Les Fantômes sont en fait des âmes qui n’ont pu rejoindre le monde de l’au-delà. Ils errent dans notre monde avec
      une mission à remplir avant de pouvoir s’en aller. Pourtant il n’est pas rare que ceux-ci ignorent eux-mêmes ce
      qu’ils doivent accomplir pour mettre un terme à leurs damnations. Certains d’entre eux auraient même, selon ouï
      dire, décider de ne pas effectuer volontairement cette mission afin de rester éternellement sur terre afin de la
      hanter et d’assouvir leurs vengeance.
