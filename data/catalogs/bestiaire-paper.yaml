    prose: "Les Ogres sont d’énormes et terrifiantes créatures. Leur peau est souvent grise et très grasse tout comme leurs cheveux. Ils vivent en général en petits groupes dans des coins reculés, là ou personne n’ose s’aventurer. Ceux-ci étant de lointains cousins des humains, ils sont capables de parler sans problème même s’ils préfèrent plutôt agir. D’une intelligence non négligeable, certains d’entre eux gouvernent des terres qu’ils exploitent ainsi que leur population. Note\_: le petit d’un ogre s’appelle un Ogrichon. Alimentation L’alimentation d’un Ogre est principalement constituée de viande. Dotés d’un appétit sans fin, ceux-ci sont très friands de chair tendre, telle celle des humains, principalement les plus jeunes."
