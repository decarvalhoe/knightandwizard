    prose: >-
      Gracieux et distingués, les chat sont des animaux intelligent, et habiles. Capable d’apprendre et de s’interresser
      au monde qui l’entoure. Lien Occulte Les chat sont connu pour leur liens étroit avec l’occultisme, c’est pourquoi
      les sorcières trouve toujours leurs compagnies agréable. Leur beauté combiné avec leur capacité naturelle à passer
      de l’affectueuse boule de poils au bourreau martyrisant sa proie avec délectation sont autant de preuvent de leur
      relation ambigue avec le malin. De leurs neufs vies jusqu’au chats noirs attirant le malheur sur autruit, ces
      animaux ont de tout temps fascinés et effrayés les autres races.
