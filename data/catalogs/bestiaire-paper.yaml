      inspire aux autres une peur tout à fait justifiée. Les Orcs pourrait être perçut comme les soldats parfaits. Leur
      grande force mêlée à leurs petits esprits en fait de redoutable unité n’ayant pas réellement conscience du danger.
      Ceci dit, leur animalité reprenant souvent le dessus, les Orcs sont très indisciplinés et seul un grand chef de
      guerre peut réussir à organiser ce qui peut se changer en une machine à tuer implacable. L’Entre-aide Il n’est pas
      rare de voir des Gobelins accompagner des Orcs, voir même vivre ensemble. En effet selon bon nombre de
      scientifiques, ces deux races auraient une seule et même racine commune.
