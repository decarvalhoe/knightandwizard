    prose: "Les centaures sont des réels force de la nature. Puissants, rapides et agiles, ceux-ci peuvent facilement mettre à sac une ville ou un village. Leurs esprits violents, concupiscents ainsi que leur attirance pour le bon vin est célèbre dans le monde entier, et il ne fait jamais bon de refuser de partager (voir d’offrir) son outre ou même sa femme… Les Centauresses Les légendes grecques, qui sont à l’origine des centaures, ne mentionnent pas l’existence de «\_centaures femelles\_», les mâles s’accouplant avec de jeunes humaines. Les centauresses n’apparaîtront que bien plus tard dans les romands fantaisistes."
