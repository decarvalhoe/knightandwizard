    prose: >-
      Créatures très sociales, plus particulièrement entre elles, les hommes rats sont plutôt imprévisibles, voir
      instables. Leur ténacité n'a d'égal que leur capacité à s'adapter très rapidement à une situation imprévue n'ayant
      jamais été vécue auparavant, car un homme rat ne tombe jamais deux fois dans le même piège. Toutes personnes ayant
      un jour été compagnon de l'un d'entre eux, pourra certifier le changement particulier qui s'opère chez eux
      lorsqu'ils rencontrent l'un de leur congénère. Instantanément ils deviennent plus surs d'eux, plus énergiques et
      d'humeur considérablement meilleure. Vifs d'esprit et rapides, ils font preuve d'une intelligence et d'un sens
      pratique surprenant. Combattants, endurants, leur stratégie repose essentiellement sur leur supériorité numérique.
      La débauche la plus totale qui caractérise leurs vies est à l’antipode de leur capacité à obéir ou agir en
      synchronisation. Les faibles sont rapidement rejetés ou dévorés par leurs pairs mais malgré l'apparence très
      concurrentielle de leur microcosme, il est également basé sur le partage. En effet, les Hommes Rats dorment
      ensemble dans de grandes bâtisses, se lavent ensemble en se réunissant et chose surprenante, l'éducation de leur
      progéniture est assurée par toute la communauté. La Mort de l’Empereur Ces créatures n'obéissent pas qu'a la loi
      du plus fort, les joutes qui ont lieu lors de la mort de leur "Empereur" sélectionnent des candidats en fonction
      de leur efficacité, leur fourberie et leur débrouillardise. Une fois les joutes terminées une fête a lieu pendant
      laquelle de nombreux cadeaux sont offert au nouvel "Empereur". Les trahisons étant fréquentes pour ce peuple, la
      fête aura à nouveau lieux dans peu de temps.
