    prose: "D’apparence d’humaine, sauf si ce n’est leur charme légendaire, qui lui, ne peut être que surnaturel. Les ondines sont des nymphes, des naïades (nymphes des eaux) pour plus d’exactitude. Celles-ci sont les hôtes de points d’eaux vives telles que des cascades, fontaines, sources, … En tant que nymphes, les Ondines ne possèdent pas d’âmes, mais peuvent en acquérir une en renonçant à l’immortalité et en se mariant avec un homme. Dès lors connues pour leur jalousie sans limites, les ondines passe normalement le plus clair de leurs temps à chanter en coiffant leurs longues chevelures. Naïades et Néréides Les nymphes des eaux se séparent en deux catégories, les Naïades qui résident aux points d’eau terrestre et les Néréides qui elles sont dans l’océan et dans les mers. Les Naïades pour finir se divisent encore en deux. Les Ondines vivant dans les eaux agitées, appréciant les humains et même parfois se mariant avec, et les Nixes des eaux mortes et stagnantes (lac, marais, …) qui elle charme les homme pour doucement les emmener sous l’eau à tout jamais… Étymologie Le mot «\_ondine\_» provient des «\_ondes\_» créer à la surface des eaux agitées qu’elles occupent."
