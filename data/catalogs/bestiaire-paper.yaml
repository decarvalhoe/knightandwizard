      Les Nains possèdent un fort caractère, ainsi certains diront même que ces êtres sont plus entêtés que le pire des
      ânes. Mais c’est également dans cette détermination que l’on voit toute la grandeur naine, inversement
      proportionnelle à leur taille. Cette volonté combinée à leur force surnaturelle et à leur incroyable résistance
      fait d’eux de redoutables guerriers que les autres races ont appris à respecter. Us et Coutumes Les Nains
      attachent une grande importance à leur barbe qui représente leur ancienneté et donc le degré de respect auquel ils
      peuvent prétendre. Renommée Les Nains sont les meilleurs artisans qui soient, principalement dans le domaine de
      l’architecture, de la joaillerie et la forge. Mais surtout, les nains sont les meilleurs brasseurs de bières.
