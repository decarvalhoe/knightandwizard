    prose: >-
      Les Hommes Lézard sont des créatures imperturbables, flegmatiques même dans les pires situations. Ces êtres sont
      connus pour ne jamais battre en retraite, donnant ainsi une force considérable à leurs troupes. Toutefois, malgré
      cet avantage que leur envieraient bien d’autres races, les Hommes Lézards préfèrent les escarmouches ciblées,
      rapides et précises, se retirant avant de donner a leurs adversaires le temps de répliquer. Mais, malgré tout, les
      Hommes Lézard restent un peuple très pacifique et ne s’occupent que très rarement des affaires extraterritoriales.
