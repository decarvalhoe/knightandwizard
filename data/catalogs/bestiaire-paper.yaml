    prose: "Les gobelins sont de sale petite créature au teint verdâtre, aux dents pointues et aux griffes acérées. La légende voudrait qu’ils naissent spontanément de l’ombre d’un mort. Ces créatures sont nocturnes et ne supporte que peu la lumière. Leur taille n’étant point à leur avantage, les Gobelins ont développé un esprit sournois légendaire et lorsqu’il s’agit de jouer un mauvais tour, ceux-ci ne sont jamais loin. Le Fléau Malgré toutes les appréhensions et les jugements que peuvent porté les autres races sur les dites «\_Peaux Vertes\_», cette dernière est souvent appelée «\_Fléau\_». Attaquant en nombre incalculable, pillant, rasant villes et villages, lorsque les Gobelins déferlent, personnes n’est à l’abri."
