      ils auront des mentalités qui se rapprochent plus ou moins de l’elfe ou de l’homme. Type de Demi Elfe Les
      Demi-Elfes possèdent un géniteur étant soit Haut-Elfe, Elfe des bois ou, très rarement, Elfe de nacre, les Elfes
