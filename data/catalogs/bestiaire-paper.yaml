      - Vision nocturne
    prose: >-
      De toutes les Terres Oubliées, les gnomes sont probablement l'un des peuples les plus mystérieux. En effet, ces
      petites créatures ne se mêlent que rarement aux autres races et ont un avantage évident pour se cacher aux yeux
      des personnes trop curieuses. Pratiquement toujours de bonne humeur, les gnomes attache beaucoup d'importance à
      leur cercle social, la nature et à l'humour. Ces deux derniers points semblent avoir profilés chez eux une culture
      de la magie d'illusion particulièrement poussée et aujourd'hui encore il est reconnu de tous que les plus grand
      illusionnistes ne mesure pas plus de 50 centimètres.
