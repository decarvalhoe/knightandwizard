        ref: entry:beaute-desarmante
  - id: bluff
    term: Bluff
    kind: unknown
    duration: permanent
    prose: Cet atout diminue la difficulté d’un jet de mensonge de 1.
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:bluff
  - id: bonne-nuit
    term: Bonne nuit
    kind: unknown
    prose: >-
      Le personnage peut de son regard endormir celui ou ceux (une personne par niveau) qui le croiseront, sous un jet
      de volonté avec comme difficulté supplémentaire le niveau du personnage. (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:bonne-nuit
  - id: bouc-emissaire
    term: Bouc émissaire
    kind: unknown
    prose: >-
      En regardant quelqu’un dans les yeux, le personnage peut manipuler son mental de manière à ce qu’il soit persuadé
      d’avoir commis un crime effectué par le personnage. C’est effet dure 1 jour par niveau. (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:bouc-emissaire
  - id: bouclier-des-arcanes
    term: Bouclier des arcanes
    kind: unknown
    prose: >-
      Le magicien peut à tout moment expulser l’énergie magique de son corps sous la forme d’une bulle protectrice
      prenant la teinte de la magie du lanceur. Ce bouclier se développe en 1 DT et peut être dissipé à n’importe quel
      moment. Durant cette période, le magicien acquiert une protection totale égale à son niveau. Le bouclier des
      arcanes coûte 1 point d’énergie par DT. Notons encore qu’il ne s’agit pas là d’un sort, mais d’un atout, ce qui
      permet de l’utiliser en incantant un autre sort par exemple.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:bouclier-des-arcanes
  - id: boussole-interne
    term: Boussole interne
    kind: unknown
    prose: Additionne le niveau au nombre de dés lors d’un jet basé sur l’orientation. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:boussole-interne
  - id: brulure-de-largent
    term: Brûlure de l’argent
    kind: unknown
    prose: >-
      L’auto régénération du personnage ne s’applique pas lorsque celui-ci est blesser par de l’argent. Ces blessures
      guérissent normalement. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:brulure-de-largent
  - id: brumathropie
    term: Brumathropie
    kind: unknown
    prose: >-
      Permet au personnage de se changer en brume. La transformation prend 50 DT. Sous forme de brume, le personnage ne
      peut subir, ni engendrer des actions physiques. Il ne pourra donc pas frapper, et un coup le traversera, sans le
      blesser. Sous cette forme, le personnage peut s’engouffrer et passer par les interstices d’une porte, un trou de
      serrure, … Cette forme brumeuse prend grossièrement la forme du personnage et quelqu’un d’attentif pourra le
      détecter. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:brumathropie
  - id: branchies
    term: Branchies
    kind: unknown
    prose: >-
      Le magicien incante une formule puis met ses mains des deux cotés de son cou (ou de celui de sa cible) et fait
      claquer sa langue. Des branchies permettant de respirer sous l’eau naissent alors à l’endroit ou ses mains étaient
      posées.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:branchies
  - id: branchies-de-masse
    term: Branchies de masse
    kind: unknown
    prose: >-
      Le magicien incante une formule puis désigne ses cibles d’un large mouvement de bras et fait claquer sa langue.
      Des branchies permettant de respirer sous l’eau naissent alors sur le cou des cibles choisies. Le sort s’applique
      à autant de cible que le lanceur aura fait de réussites, pour autant que ces cibles soit visible par le magicien.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:branchies-de-masse
  - id: brume
    term: Brume
    kind: unknown
    duration: ephemeral
    prose: >-
      Le personnage peut embrumer autour de lui dans un rayon étant égal à son niveau. Celui-ci n’a aucune pénalité de
      vision dans sa propre brume.
    metadata_raw:
      - (Ephémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:brume
  - id: cachette-secrete
    term: Cachette secrète
    kind: unknown
    duration: ephemeral
    prose: >-
      Le personnage peut faire disparaître un objet, n’étant pas plus grand que lui, pendant une minute par niveau.
      Passé ce délai, l’objet tombe à terre des vêtements du personnage.
    metadata_raw:
      - (Ephémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:cachette-secrete
  - id: cage-dos
    term: Cage d’os
    kind: sort
    school_raw: nécromancie
    prose: >-
      Le magicien cisaille l’air de haut en bas avec ses deux mains en baragouinant des incantations. Une cage d’os
      entremêlés soudés entre eux sort alors de terre et se referme sur la/les cible(s). Le rayon de la cage est de 1
      mètre par niveau du lanceur de sort. Celle-ci reste en place 10 minutes par niveau avant de avant de partir en
      cendres. Pour casser les barreaux, un personnage devra faire un jet de difficulté +3, + le nombre de réussites du
      magicien.
    metadata_raw:
      - (Sort de nécromancie)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
