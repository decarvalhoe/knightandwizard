  - id: apathie
    term: Apathie
    kind: sort
    school_raw: noire
    prose: "Les bras le long du corps, l'air abattu, le magicien regarde fixement mais avec un air de désintérêt total sa cible, tout en récitant la formule. Prenant soudainement et brutalement conscience de la vacuité de l’existence et de l’absurdité de la vie, la cible de ce sort est en proie à un profond abattement qui la rend complètement apathique, blasée, et insensible aux événements qui se passent autour de lui (mais pas suicidaire\_: à quoi bon mourir, on meurt toujours trop tard)."
    metadata_raw:
      - (Sort de magie noire)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:apathie
  - id: appel
    term: Appel
    kind: sort
    school_raw: naturelle
    prose: "Le magicien se tient droit comme un «\_I\_» tout en marmonnant une formule inaudible. Soudain, il tape par terre de son pied. De la zone d’impact se dégage alors un appel plus ou moins spécifique qui courra au oreilles des première cibles qu’il rencontrera. L’appel se propage en cercle autour du magicien sur un rayon de 10 mètres par réussite obtenue. Le nombre de créatures appelées est égal au niveau du magicien. Tant que la vague d’appel n’à pas rencontrée suffisamment de cible, elle continue d’avancer jusqu’à ce qu’elle s’épuise à cause de la distance. Les créatures ressentant cet appel sont attirées par l’endroit sans réellement comprendre pourquoi. Elles iront sur le lieu de l’appel plus ou moins vite selon leurs tempéraments et moyens. Enfin, arrivé face au magicien, elles adopteront le comportement qu’elles voudront. Elles peuvent décider d’aider le magicien, de l’attaquer, de repartir, etc. Ainsi il est conseillé d’appeler des créatures avec lesquelles on s’entend bien. Le sort n’appelle pas les créatures visibles par le magicien. Donc par exemple, dans un combat, un «\_Appel des mammifères\_» n’appellera pas l’assailant du magicien si celui-ci est un homme. Enfin une même créature peut être appelée par plusieurs appel différents. Par exemple un loup peut être apellé par «\_Appel des mammifères\_» ou «\_Appel des loups\_»."
    metadata_raw:
      - (Sort de magie naturelle)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:appel
