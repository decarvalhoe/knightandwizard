  - id: captage-denergie
    term: Captage d’énergie
    kind: sort
    school_raw: abjuration
    prose: "Le lanceur de sort tend la main gauche en direction d’un magicien qui incante et la referme, attirant à lui de l’énergie mobilisée pour lancer le sort. La fuite d’énergie produite à alors plusieurs effets. Premièrement le magicien «\_perturbateur\_» gagne ces points à hauteur de 3 points d’énergie par réussite. Secondement, le magicien «\_perturbé\_» devra choisir entre compenser cette fuite en utilisant plus d’énergie pour son sort (ce qui implique que le magicien «\_perturbateur\_» peut lui voler plus de points d’énergie que le sort n’en demande à la base), ou alors accepter l’annihilation de sa tentative magique (dans quel cas, le magicien «\_perturbateur\_» ne peut prendre que les points d’énergies normalement utilisé pour le sort). Le magicien «\_perturbé\_» ne connaît pas le nombre de réussite du magicien «\_perturbateur\_» au moment de faire son choix."
    metadata_raw:
      - (Sort d’abjuration)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:captage-denergie
  - id: centaure-illusoire
    term: Centaure illusoire
    kind: sort
    school_raw: illusoire
    prose: >-
      Le magicien ferme les yeux et pense à corps de centaure. Sa bouche se met à murmurer une formule tandis que ses
      mains semblent façonner un corps de terre glaise. Dans ses bras apparaît alors un centaure illusoire. Celui-ci
      reste 10 minutes par niveau du lanceur. Cette illusion peut être mâle ou femelle et peut avoir vêtement et
      équipement à sa disposition. La description de l’illusion revient au magicien. Il peut donc décider des créer des
      centaures à l’image d’une personne existante.  Néanmoins, son nombre de réussite influera sur la qualité de son
      résultat.
    metadata_raw:
      - (Sort de magie illusoire)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:centaure-illusoire
  - id: cercle-de-fleur
    term: Cercle de fleur
    kind: sort
    school_raw: naturelle
    prose: >-
      Le magicien se baisse et dessine un cercle du doigt sur le sol en incantant une formule. Instantanément un cercle
      de fleurs pousse à l’endroit désigné. Pour ce faire, il est nécessaire que le sol désigné soit une terre fertile.
    metadata_raw:
      - (Sort de magie naturelle)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:cercle-de-fleur
  - id: cerebralite
    term: Cérébralité
    kind: atout
    niveau: 2
    duration: permanent
    prose: >-
      Le personnage peut décider de parler avec un langage cérébral et incompréhensible au commun des mortels en faisant
      maintes métaphores et autres jeux de langage à chacun de ses mots, si bien que seul ceux qui possèdent cet atout
      peuvent se comprendre entre eux. Les personnages doivent néanmoins parler la même langue.
    metadata_raw:
      - (Permanent)
      - "(Atout niveau 2 d’orientation\_: Artiste)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:cerebralite
  - id: champ-de-boue
    term: Champ de boue
    kind: sort
    school_raw: élémentaliste
    prose: >-
      Le magicien met ses mains au niveau de ses hanches et, d’un geste lent, les paumes des mains vers le haut, les
      biceps tendus, il appelle l’eau des sous-sols en surface pour transformer une surface en champs de boue, rendant
      ainsi les déplacements plus difficiles. Pour réussir à se déplacer, les personnages présents dans le champ de boue
      doivent faire un jet de force de difficulté 5 + le nombre de réussites obtenues par le magicien lorsqu’il a jeté
      son sort. La zone du champ doit être visible par le lanceur et s’étends sur 10 mètres carré par niveau de
      celui-ci.
    metadata_raw:
      - (Sort de magie élémentaliste)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:champ-de-boue
  - id: chance
    term: Chance
    kind: unknown
    duration: ephemeral
    prose: Le joueur peut demander à refaire, ou faire refaire, un jet directement lié à son personnage.
    metadata_raw:
      - (Ephémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:chance
  - id: changement
    term: Changement
    kind: unknown
    prose: >-
      Le magicien fait de grands gestes tout en incantant semblant ordonner à sa cible de devenir ce qu’elle n’est pas.
      Puis, le corps de la cible se tord de douleur s’agrandit, se rétrécit selon la forme définitive, change de
      couleur, la matière se transforme et la cible se change définitivement en la forme désirée par le magicien. Si la
      cible le désire, elle peut contrer le jet du magicien de par un jet d’endurance. Une transformation est toujours
      une expérience désagréable pouvant mener à la folie.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:changement
  - id: changement-spectral
    term: Changement spectral
    kind: unknown
    prose: >-
      Le magicien croise les bras sur son torse et tire la tête en arrière en fermant les yeux. Il dis un seul mot et se
      met à hurler (ou à gémir s’il est pudique) de douleur et son corps se dématérialise peu à peu (ce qu’il porte sur
      lui aussi), des pieds à la tête, dans un épais nuage de fumée grise. Il ne peut plus être touché ou toucher ce qui
      est matériel et peut donc, par exemple passer à travers les murs. Il ne fait aucun bruit mais ne peut parler non
      plus, par contre il entend. Il peut lancer des sorts non physiques et être touché par ceux-ci. Le magicien se
      déplacera en flottant dans l’air à sa vitesse habituelle. Comme se dématérialiser est extrêmement douloureux, la
      volonté du nécromancien ainsi que son intelligence et sa perception sont réduit de moitié. Sa re-matérialisation
      sera vécue comme une délivrance. Elle commencera par la tête. Le magicien nécessitera d’un temps égal à celui
      qu’il à passé sous sa forme spectral pour récupérer de cette expérience. Ce sort dure10 minutes par réussite, le
      magicien peut mettre fin au sort à tout moment.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:changement-spectral
  - id: chant-envoutant
    term: Chant envoûtant
    kind: atout
    classe: Chanteur
    duration: permanent
    prose: >-
      Lorsque le personnage se met à chanter, les personnes autour de lui doivent faire un test de volonté pour ne pas
      être séduit directement (difficulté +1 par niveau du chanteur). Cet état se dissipe lentement après le chant (en
      fonction des réussites).
    metadata_raw:
      - (Permanent)
      - "(Atout niveau 4 de classe\_: Chanteur)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:chant-envoutant
  - id: chat-illusoire
    term: Chat illusoire
    kind: sort
    school_raw: illusoire
    prose: >-
      Le magicien entame une incantation très douce à voix basse. Ses mains semblent se mettre à caresser les contours
      de quelque chose qui au fur et à mesure apparaît. Dans ses bras apparaît alors un chat illusoire. Celui-ci reste
      10 minutes par niveau du lanceur. Cette illusion peut être mâle ou femelle. La description de l’illusion revient
      au magicien. Néanmoins, son nombre de réussite influera sur la qualité de son résultat.
    metadata_raw:
      - (Sort de magie illusoire)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:chat-illusoire
  - id: cheval-illusoire
    term: Cheval illusoire
    kind: sort
    school_raw: illusoire
    prose: >-
      Le magicien entame une incantation très douce à voix basse. Ses mains semblent se mettre à caresser les contours
      de quelque chose qui au fur et à mesure apparaît. Dans ses bras apparaît alors un cheval illusoire. Celui-ci reste
      10 minutes par niveau du lanceur. Cette illusion peut être mâle ou femelle. La description de l’illusion revient
      au magicien. Néanmoins, son nombre de réussite influera sur la qualité de son résultat.
    metadata_raw:
      - (Sort de magie illusoire)
