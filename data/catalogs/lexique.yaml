  - id: voix-surnaturelle
    term: Voix surnaturelle
    kind: atout
    orientation: Magicien
    niveau: 5
    duration: permanent
    prose: >-
      Le personnage peut, quand il le désire, moduler sa voix qui devient alors plus impressionnante mais d’aspect non
      naturel. Quand le personnage utilise sa voix surnaturelle, il peut additionne son niveau au nombre de dès lors
      d’un jet de charisme.
