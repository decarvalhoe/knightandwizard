    kind: atout
    orientation: Ouvrier
    niveau: 2
    duration: permanent
    prose: Donne une résistance de +1E au corps du personnage.
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 2 de l’orientation\_: Ouvrier)"
    source_refs:
