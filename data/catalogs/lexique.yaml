  - id: eclosion
    term: Eclosion
    kind: sort
    school_raw: naturelle
    prose: >-
      Le magicien entame une courte formule magique ressemblant à un souffle de vent printanier tout en effleurant une
      plante. Les fleurs présentes sur celle-ci se mettent alors à éclorent. Le nombre maximum de fleurs qui peuvent
      éclore est égal au nombre de réussite du lanceur de sort tout en étant limité par le nombre de fleurs présentes
      sur la plante bien évidemment. Notez que ce sort n’est pas une croissance accélérer et donc qu’il ne fait pas
      pourrir les fleurs.
