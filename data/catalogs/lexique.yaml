  - id: torsion-du-bois
    term: Torsion du bois
    kind: sort
    school_raw: naturelle
    prose: >-
      Le magicien se concentre sur un arbre et tends sa paume en direction de celui-ci. Puis, tout en psalmodiant une
      formule magique, et manœuvre son bras étant cette fois imité par l’arbre. L’arbre cible peut être incliné, penché,
      tordu aussi bien au niveau de son tronc qu’à ses branches. Il ne peut par contre pas se casser dans sa torsion. Il
      se peut que l’arbre reprenne sa forme initiale avec le temps. Le magicien pour réussir à tordre un arbre à sa
      volonté doit faire au minimum une réussite par tranche de 10 ans de l’arbre. Par exemple, un arbre de 7 ans
      demande 1 réussite, un arbre de 20 ans demande 2 réussites et un arbre de 21 ans demande 3 réussites.
    metadata_raw:
      - (Sort de magie naturelle)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:torsion-du-bois
  - id: totem
    term: Totem
    kind: unknown
    duration: permanent
    prose: "Cet atout est à choisir avec une race animale se rapprochant du personnage. Les animaux de cette race reconnaissent le personnage comme l’un des leurs et ne lui feront aucun mal. Au contraire s’ils ont la possibilité de l’aider, ils le feront dans la mesure de leurs moyens. Cet atout ne peut être choisit qu’une seule fois et ne peut être combiné avec l’atout «\_Enfant de l’élément\_»."
    metadata_raw:
