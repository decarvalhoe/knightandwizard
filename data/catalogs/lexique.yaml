  - id: energie-a-lhonneur
    term: Energie à l’honneur
    kind: atout
    orientation: Magicien
    niveau: 4
    duration: ephemeral
    prose: >-
      Le personnage teint l’air qui l’entoure, de la couleur de sa magie dans un rayon égal à son niveau en mètre. Dans
      cet environnement les sorts de la magie à l’honneur voient leurs difficultés baissées de 1 pendant 10
      minutes/niveau. Mettre une énergie à l’honneur prend 10DT non réductible.
    metadata_raw:
      - (Ephémère)
      - "(Atout de niveau 4 de l’orientation\_: Magicien)"
