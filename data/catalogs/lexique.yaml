    kind: unknown
    prose: >-
      Le personnage peut se stopper net ou et quand bon lui semble pendant 1 DT/niveau. Pendant se temps il peut
      entreprendre des action (comme par exemple se rattraper lors d’une chute qu’il peut stopper). (éphémère)
