  - id: partenaire-ideal
    term: Partenaire idéal
    kind: atout
    classe: Danseur
    duration: permanent
    prose: "Lorsque le personnage danse avec quelqu’un, celui-ci peut décider de lui transférer un ou plusieurs dés pris dans sa compétence\_de danse. Cet effet prend fin à la fin de la danse."
    metadata_raw:
