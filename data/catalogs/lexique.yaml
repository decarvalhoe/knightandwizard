  - id: pas-leger
    term: Pas léger
    kind: unknown
    prose: >-
      Permet au personnage de ne plus faire aucune trace de pas en marchant, et ce, sur n’importe quelle surface. Cet
      effet dure 10 minutes par niveau. (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
