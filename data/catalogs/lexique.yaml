  - id: marche-sur-leau
    term: Marche sur l’eau
    kind: sort
    school_raw: enchanteresse
    prose: >-
      Le magicien avance sur les flots, les bras d’abords tendus sur les côtés, comme en équilibre sur un fil
      imaginaire. Il murmure une petite mélopée monotone durant les premiers pas. Peu à peu, il relâche sa concentration
      et continue à marcher sur l’eau comme si c’était une surface solide et ferme. L’eau porte la cible du sort jusqu’à
      un maximum de 10 kg par réussites pendant 10 minutes  par niveau du lanceur de sort.
    metadata_raw:
      - (Sort de magie enchanteresse)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
