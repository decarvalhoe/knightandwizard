  - id: terre-sterile
    term: Terre stérile
    kind: sort
    school_raw: nécromancie
    prose: >-
      Le magicien enfonce ses doigts dans le sol en grondant une formule sourde et effrayante. Les microorganismes et
      éléments nutritifs présent dans le sol meurent alors ou disparaissent, rendant le sol stérile à tout plantation
      sur un rayon de 3 mètres par niveau du lanceur de sort et s’étendant autour de ce dernier. Notez bien que ce sort
      ne fait pas disparaître l’eau présente. Il rend juste la terre totalement inutilisable à la croissance de plantes.
    metadata_raw:
      - (Sort de nécromancie)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:terre-sterile
  - id: terreur
    term: Terreur
    kind: unknown
    duration: permanent
    prose: >-
      Le personnage provoque la terreur chez les autres. Ceux-ci doivent en sa présence faire un test de volonté, avec
      une difficulté supplémentaire égale au niveau du personnage, pour maîtriser leur peur. Attention, un personnage
      possédant cet atout s'y voit immunisé ainsi qu’à la peur.
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:terreur
