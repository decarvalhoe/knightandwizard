    term: Victime
    kind: unknown
    prose: >-
      Le personnage peut choisir un être vivant (qu’il voit) et saura en permanence dans quelle direction aller pour
      retrouver celui-ci. Il peut décider de changer d’être quand il le souhaite. (permanent)
