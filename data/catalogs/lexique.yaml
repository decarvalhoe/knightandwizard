  - id: baiser-purificateur
    term: Baiser purificateur
    kind: atout
    niveau: 10
    duration: ephemeral
    prose: "Le personnage peut, simplement en embrassant la personne qu’il aime, dissiper tous les sorts actifs sur celle-ci. Cet atout est accessible aux personnages disposant de l’atout «\_Grand amour\_»."
    metadata_raw:
