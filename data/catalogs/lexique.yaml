  - id: detection-des-projectiles-portants
    term: Détection des projectiles portants
    kind: atout
    orientation: Guerrier
    niveau: 5
    duration: permanent
    prose: "Le personnage à une telle habitude d’être sous les feux balistiques qu’il a développé un instinct lui indiquant si le projectile lui est, ou non, destiné, en se basant entre autres, sur le son émit par celui-ci. Le joueur peut donc savoir si le projectile le touche avant de décider de son action (esquive, parade, continuer sa propre action, etc). La détection des projectiles portant ne s’applique qu’aux projectiles que le personnage peut voir (étant donné que s’est en fait l’absence de son qui indique que d’un projectile nous somme la cible). Cet atout ne peut être choisit que si le personnage possède l’atout «\_Détection des coups portants\_» ainsi qu’un score minimum de 4 en ouïe (l’ouïe est une compétence)."
