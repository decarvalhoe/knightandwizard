  - id: aura-benefique
    term: Aura bénéfique
    kind: unknown
    prose: >-
      Le personnage dégage une aura qui empêche tout sort de magie noire d’être incantée sur un rayon d’un mètre par
      niveau, par un magicien d’un niveau inférieur. (permanent)
    source_refs:
