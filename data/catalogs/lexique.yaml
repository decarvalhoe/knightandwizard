  - id: regard-de-braise
    term: Regard de braise
    kind: unknown
    prose: Annule les pénalités dues à une luminosité trop intense ou même au soleil. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
