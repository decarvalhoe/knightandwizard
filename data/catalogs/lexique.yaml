  - id: emprise-corporelle
    term: Emprise corporelle
    kind: unknown
    prose: >-
      Le magicien baisse la tête en récitant d’inquiétantes formules, puis soudain la relève brusquement en fixant sa
      cible dans les yeux. La cible effectue un test d’intelligence, si elle n’arrive pas à égaler ou dépasser le nombre
      de réussite du lanceur de sort, l’esprit de ce dernier passera alors dans le corps de sa cible. L’esprit de sa
      cible sera retranché dans un recoin de sa propre tête, témoin de tout, mais incapable d’agir. Le sort dure 10
      minutes par niveau du lanceur. Pendant cette période, le corps du magicien est inerte. De plus si le corps de la
      cible venait à mourir, le magicien mourrait avec celle-ci.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:emprise-corporelle
