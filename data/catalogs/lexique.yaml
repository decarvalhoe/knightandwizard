  - id: multilinguisme
    term: Multilinguisme
    kind: sort
    school_raw: enchanteresse
    prose: >-
      Le magicien met l’index devant sa bouche et fait quelques aller et retour en direction de la bouche d’un
      interlocuteur parlant une autre langue. Une traînée étincelante turquoise subsiste après le passage de son index.
      Ce faisant, il prononce la formule adéquate. Le magicien parlera comme dans sa langue sauf que, les sons sortiront
      comme traduit dans la langue de son interlocuteur, avec un décalage entre les mouvements de ses lèvres. Le
      magicien ne comprendra alors plus les mots qui sortiront de sa bouche. Il ne pourra pas non plus comprendre ce que
      lui réponds son auditeur, il faudra donc pour mener à bien une conversation que le sort soit aussi lancé sur son
      interlocuteur. Le niveau de langage de la cible du sort est égal au nombre de réussite du sort. Ce sort fonctionne
      sur tout être intelligent s’exprimant oralement.
    metadata_raw:
      - (Sort de magie enchanteresse)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:multilinguisme
  - id: mur-illusoire
    term: Mur illusoire
    kind: sort
    school_raw: illusoire
    prose: >-
      Le magicien se met à lisser une surface devant lui tout en incantant très vite une courte formule. Un mur
      illusoire apparaît alors là ou les mains du magicien l’avaient dessiné. Ce mur fait 1 mètre de haut pour 3 mètre
      de long par réussites obtenues. Cette illusion dure 10 minutes par niveau du lanceur.
    metadata_raw:
      - (Sort de magie illusoire)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:mur-illusoire
  - id: murissement
    term: Mûrissement
    kind: sort
    school_raw: naturelle
    prose: >-
      Le magicien entame une courte formule magique ressemblant à un souffle de vent printanier tout en effleurant une
      plante. Les fruits présents sur celle-ci se mettent alors à mûrir. Le nombre maximum de fruits qui peuvent murir
      est égal au nombre de réussite du lanceur de sort, tout en étant limité par le nombre de fruits présents sur la
      plante bien évidemment. Notez que ce sort n’est pas une croissance accélérer des fruit et donc ne les fait pas
      pourrir.
    metadata_raw:
      - (Sort de magie naturelle)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:murissement
