  - id: nouvelle-du-monde
    term: Nouvelle du monde
    kind: sort
    school_raw: divination
    prose: >-
      Le magicien se concentre, visualise la carte du continent et un point apparaît en brun foncé. Son regard se
      focalise dessus et il voit apparaître un événement qui se déroule actuellement. Des informations à propos de cet
      événement lui parviennent dans la tête. Le magicien ne peut pas choisir le thème de sa vision. 1 information par
      réussite.
    metadata_raw:
      - (Sort de divination)
