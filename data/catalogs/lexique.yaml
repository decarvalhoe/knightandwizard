    term: Vegothropie
    kind: unknown
    duration: permanent
    prose: >-
      Le personnage peut se transformer en plante. La durée de la transformation est de 10 minutes. La plante en
      question est relative au personnage (par exemple, les Dryades ont un type de plante auxquels elle sont liées).
