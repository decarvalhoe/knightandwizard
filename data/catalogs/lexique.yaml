  - id: passe-partout
    term: Passe-partout
    kind: sort
    school_raw: enchanteresse
    prose: "Le magicien tend sa son doigt en direction d’une serrure de porte puis le tourne comme s’il s’agissait d’une clef tout en récitant calmement une formule. La porte se verrouille (ou se déverrouille) alors. Ce sort ouvre des serrures «\_standards\_». Le maître de jeu peut exiger, pour une serrure plus complexe, plusieurs réussites."
    metadata_raw:
      - (Sort de magie enchanteresse)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
