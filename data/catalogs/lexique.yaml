  - id: perception-des-energies
    term: Perception des énergies
    kind: atout
    orientation: Magicien
    niveau: 7
    duration: permanent
    prose: "Le personnage peut à tout moment «\_enclenché\_» sa perception des énergies. La couleur de ses iris peut alors changer. Le magicien percevra alors le monde de façon différente. Cet atout lui donne le don de percevoir l'énergie pure. Le magicien qui en est doté voit des brumes colorées scintillantes teintées de la couleur de la magie en question, un peu comme des aurores boréales. Il pourra estimer les stocks d'énergie dans un lieu, percevoir les fortes concentrations d'une énergie, mais il a aura aussi la capacité de voir les mouvements, les variations d'énergie. Si un sort est lancé, il pourra estimer la quantité d'énergie nécessaire pour le lancer, la localisation du lanceur et la nature de l'énergie utilisée (donc la couleur...). Pour choisir cet atout, il est nécessaire que le personnage possède les atouts\_: «\_Ressentir la magie\_» et «\_Savoir la magie\_»."
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 7 de l’orientation\_: Magicien)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:perception-des-energies
  - id: perfectionnisme
    term: Perfectionnisme
    kind: unknown
    duration: permanent
    prose: >-
      Permet de retravailler un objet déjà crée de manière à additionné les réussites de qualité. Un personnage peut
      retravailler autant de fois un objet qu’il possède de points de perfectionnisme.
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:perfectionnisme
  - id: periple
    term: Périple
    kind: unknown
    duration: ephemeral
    prose: >-
      Diminue la difficulté de 5 une manœuvre de déplacement ou un jet basé sur le voyage (avec le moyen de locomotion
      de prédilection).
    metadata_raw:
      - (Ephémère)
    source_refs:
