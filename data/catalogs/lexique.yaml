  - id: baiser-de-la-nuit
    term: Baiser de la nuit
    kind: unknown
    prose: >-
      Le personnage peut faire boire à un humain, un peu de sang vampirique pour transformer sa proie en goule. Cette
      opération peut être faîte en une fois ou sur plusieurs nuits. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
