  - id: vision-ante-mortem
    term: Vision ante mortem
    kind: sort
    school_raw: divinatoire
    prose: >-
      Le magicien touche un bout du cadavre et dessine de ses doigts une ligne droite dessus, pendant ce temps il passe
      son autre main devant ses yeux tout en récitant une formule. Le magicien va avoir une vision subjective des
      événements marquants de la vie du défunt.
    metadata_raw:
      - (Sort de magie divinatoire)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:vision-ante-mortem
  - id: vision-du-reve
    term: Vision du rêve
    kind: sort
    school_raw: divinatoire
    prose: >-
      Le magicien incante une formule aux sonorités changeantes. La vitesse même de son discours varie beaucoup tandis
      que ses mouvements du corps de droite à gauche s’accompagnent d’une fermeture de ses yeux. Le magicien peut alors
      voir le rêve que fait sa cible. La cible doit faire un jet d’intelligence. Si le magicien obtient plus de réussite
      en lançant son sort, alors il aura accès au rêve de sa cible. Le magicien doit toucher sa cible pour lancer son
      sort.
    metadata_raw:
      - (Sort de magie divinatoire)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:vision-du-reve
  - id: vision-nocturne
    term: Vision nocturne
    kind: unknown
    prose: >-
      Permet au personnage de voir dans la nuit, mais pas dans le noir total. Rappelons juste que la vision nocturne ne
      permet pas de distinguer les couleurs la nuit, ni de voir en cas de noir total. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:vision-nocturne
  - id: vision-thermique
    term: Vision thermique
    kind: unknown
    prose: >-
      Permet au personnage de voir toute source de chaleur. Celle-ci brille, ce qui les rend donc visibles même dans le
      noir total. (permanent)
