  - id: membre-telescopique
    term: Membre télescopique
    kind: sort
    school_raw: altératrice
    prose: >-
      Le magicien fixe un objet qu'il veut saisir mais qui est clairement hors de sa portée. Il bougonne une formule et
      tend son bras pour saisir l'objet en question. Son bras va s'allonger et se raccourcir d’un maximum de 1 mètre par
      réussite pendant 10 minutes par niveau du lanceur de sort. Cela n'a aucune influence sur sa force ou sur sa
      dextérité, ou sa souplesse, il a juste un membre télescopique. Fonctionne sur les bras, les jambes et le cou
      (et...non, c'est tout).
    metadata_raw:
      - (Sort de magie altératrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:membre-telescopique
  - id: memoire-photographique
    term: Mémoire photographique
    kind: atout
    niveau: 2
    duration: permanent
    prose: >-
      Le personnage peut enregistrer parfaitement une scène qu’il a vu. Il peut à tout moment échanger cette image pour
      celle qu’il a devant les yeux. Cet atout peut être cumulé pour augmenter le nombre d’image en mémoire du
      personnage. Cet atout est réservé aux personnages versés dans les arts visuels.
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 2 d’orientation\_: Artiste)"
    source_refs:
