  - id: decret-de-non-repos
    term: Décret de non-repos
    kind: sort
    school_raw: nécromancienne
    prose: >-
      Le magicien pointe du doigt une cible vivante et se met a incanter en bougeant l'autre main, semblant donner des
      ordres a la cible qui, une fois le sort lancé avec succès, va ressentir un frisson désagréable et se sentira comme
      malade pendant quelque temps. Si la cible vient à mourir, elle se relèvera sous sa forme morte vivante, contrôlée
      par le magicien. Toutes cibles du sort peut faire un jet d’endurance pour contrer le jet du magicien. Si le sort
      est correctement lancé, celui-ci reste actif durant 1 jour par niveau du lanceur. Ce sort ne peut être lancé que
      sur des créatures d’une catégorie maximale de 20.
    metadata_raw:
      - (Sort de magie nécromancienne)
