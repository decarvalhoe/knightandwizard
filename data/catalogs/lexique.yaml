  - id: vide-sideral
    term: Vide sidéral
    kind: unknown
    prose: >-
      Le magicien incante en faisant de larges mouvements circulaires avec ses mains comme s’il voulait balayer la
      réalité tel un nuage de brouillard. Sa cible se retrouve alors plongée dans le vide (du sens choisit par le
      magicien). Elle se verra toujours mais ne pourra percevoir tout ce qui l’entoure. Ce sort dure 10 minutes par
      niveaux du lanceur. Le vide sidéral à un diamètre de 3 mètres par réussites.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
