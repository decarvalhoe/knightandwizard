  - id: tornade-de-coups
    term: Tornade de coups
    kind: unknown
    duration: ephemeral
    prose: Additionne un coup porté par le personnage lorsque celui-ci utilise cet atout (les coups sont tous identiques).
    metadata_raw:
      - (Ephémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
