    term: Mimétisme
    kind: unknown
    prose: >-
      La peau du personnage prend la couleur de son environnement. Cet état peut durer autant de temps que désirer. Par
      contre, si l’environnement vient à changer de couleur, la peau, elle ne peut changer de teinte qu’une fois par
      niveau. (éphémère)
