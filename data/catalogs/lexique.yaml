    term: Croissance
    kind: sort
    school_raw: naturelle
    prose: >-
      Le magicien approche ses deux main de la graine ou plante qu’il veux faire croître et entame une formule qu’il
      répète inlassablement de plus en plus fort tout en écartant les bras au fur et à mesure que la plante grandit. La
      plante grandit d’une année (l’évolution normale de la plante pendant une année) par réussite du lanceur de sort.
      Pour que la croissance soit lancée, le sol doit être fertile et la plante vivante.
    metadata_raw:
