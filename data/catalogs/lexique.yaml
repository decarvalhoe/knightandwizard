      Le magicien ferme les yeux et se concentre pour visualiser un ogre. Puis son corps se met à avoir des convulsions
      accompagné d’une formule ressemblant plus à une forte toux qu’à un dialogue sensé. Apparaît alors en face de lui
      un ogre. Celui-ci reste 10 minutes par niveau du lanceur. Cet illusion peut être ogre ou ogresse et peut avoir
      vêtement et équipement à sa disposition. La description de l’illusion revient au magicien. Néanmoins, son nombre
