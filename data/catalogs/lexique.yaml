  - id: membres
    term: membres
    kind: sort
    school_raw: nécromantique
    prose: >-
      Le magicien pointe du doigt la cible et se met à aboyer sporadiquement les paroles d'une formule magique en
      battant le rythme de l'incantation du doigt pointé. L'incantation terminée le membre sera secoué d'une série de
      spasmes puis obéira aux ordres du magicien. Ce sort permet d’animer des membres isolés (bras, jambes, etc). Un
      membre peut être réanimé par niveau du magicien. Pour ce faire, les membres doivent se trouver dans un rayon de 3
      mètres par réussites autour du magicien. La créature à qui appartenaient les membres ne doivent pas dépasser la
      catégorie 20. En ce qui concerne les points de vitalité des membres réanimés, on considère qu’un bras humain en
      possède 3 et une jambe 4. Le maître de jeu clarifiera les cas spéciaux.
    metadata_raw:
      - (Sort de magie nécromantique)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:membres
  - id: recherche-personnelle
    term: Recherche personnelle
    kind: unknown
    duration: permanent
    prose: >-
      Permet au personnage d’apprendre des connaissances par lui-même, si celui-ci à la possibilité de faire ses propres
      expériences.
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
