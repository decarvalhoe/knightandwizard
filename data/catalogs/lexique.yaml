    term: Troll illusoire
    kind: sort
    school_raw: illusoire
    prose: >-
      Le magicien lève ses deux mains et, les doigts crispés, il incante une sourde formule saccadée pendant que ses
      mains se resserrent sur des prises imaginaires. Apparaît alors en face de lui un troll. Celui-ci reste 10 minutes
      par niveau du lanceur. Cette illusion peut être troll ou trollope et peut avoir vêtement et équipement à sa
      disposition. La description de l’illusion revient au magicien. Néanmoins, son nombre de réussite influera sur la
      qualité de son résultat.
