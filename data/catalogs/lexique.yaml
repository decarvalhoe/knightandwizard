  - id: vol
    term: Vol
    kind: unknown
    prose: >-
      Le personnage peut voler. Que ce soit grâce à des ailes, une faculté mentale ou autres, celui-ci peut sans
      problème se déplacer librement dans les airs. (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
