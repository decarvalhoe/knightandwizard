  - id: pas-daraignee
    term: Pas d’araignée
    kind: unknown
    prose: >-
      Avec de l’élan, le personnage peut se décentrer contre un mur et faire un nombre de pas égal a son niveau, tout en
      étant perpendiculaire au sol. (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
