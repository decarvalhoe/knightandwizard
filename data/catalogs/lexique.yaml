      formule secrète. Les instincts primaires de survie de la cible ressortent alors au grand jour. La cible du sort,
      pour ne pas être affectée, doit faire un jet de volonté, avec un malus à sa difficulté égal au nombre de réussites
      obtenue par le lanceur de sort. Si elle échoue à ce jet, ses instincts prendront (plus ou moins en fonction de son
      jet) le dessus sur elle. Cet état dure 10 minutes par niveau du magicien. Notez que les instincts de survie
      peuvent engendrer plusieurs types de réactions (agressivité, fuite, ou encore le fait e se jeter sur la
      nourriture).
    metadata_raw:
