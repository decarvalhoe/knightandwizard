    term: TI
    kind: unknown
    prose: >-
      Abréviation de Temps d’Incantation. Celui-ci représente le temps (en DT) que le magicien prendra pour lancer un
      sort de manière classique. Celui-ci peut à tout moment décidé d’amoindrir son TI en dépensant 2 PS supplémentaires
      par DT  supprimé.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
