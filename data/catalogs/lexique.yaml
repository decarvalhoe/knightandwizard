  - id: augmentation-energetique
    term: Augmentation énergétique
    kind: sort
    school_raw: abjuratrice
    prose: >-
      Le magicien incante une formule tout en se concentrant sur l’incantation d’un autre magicien. Ses bras s’élèvent
      comme ceux d’un chef d’orchestre qui demande plus de volume à ses chœurs. Le sort de la cible voit son coût en
      énergie augmenter de 2 par réussite obtenue par l’abjurateur. Ce sort doit donc, évidemment, être lancé durant la
      phase d’incantation du magicien cible.
