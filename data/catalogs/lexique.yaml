  - id: effacement-des-traces
    term: Effacement des traces
    kind: sort
    school_raw: naturelle
    prose: >-
      Agenouillé, le magicien demande poliment à mère nature d’effacer les traces de son passage en lui montrant de la
      main comment faire. Les végétaux et les animaux présents effaceront ou masqueront toutes les traces du passage de
      la cible du sort (visuelles, olfactives, gustatives) à partir du point au le sort à été lancé et ce, pendant 10
      minutes par niveau du lanceur de sort. La difficulté pour pister la cible du sort sera alors augmentée de 1 par
      réussite obtenue par le magicien. Notez que la cible peut être un objet (par exemple une charrette) et qu’il faut
      bien sûr un minimum de végétaux à proximité pour que ce sort soit efficace.
    metadata_raw:
      - (Sort de magie naturelle)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:effacement-des-traces
