  - id: motivation-macabre
    term: Motivation macabre
    kind: atout
    orientation: Guerrier
    niveau: 6
    duration: permanent
    prose: "Lors d’un combat, le personnage peut ajouter un dès à chacune de ses actions pour chaque ennemi qu’il aura tué. Le nombre de dès ainsi additionnés ne peut dépasser le score du personnage en «\_Motivation macabre\_». Cet atout ne peut être choisi par un Haut Elfe, Elfe des Bois ou un justicier."
