        ref: entry:vol-de-secret
  - id: vue
    term: Vue
    kind: unknown
    duration: permanent
    prose: >-
      La vue s’exprime en pour cent. Ce qui signifie qu’un homme normal possède une vision de 100%. Certaine race
      peuvent voir plus ou moins loin selon leurs aptitudes naturelles.
    metadata_raw:
      - (Permanent)
