    term: Persécution
    kind: unknown
    duration: permanent
    prose: >-
      Cet atout est à choisir avec une race, voir une classe. Il additionne 1 dé à tous les jets pouvant nuire à la
      cible choisie.
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:persecution
  - id: persistance-magique
    term: Persistance magique
    kind: atout
    orientation: Magicien
    niveau: 3
    duration: permanent
    prose: >-
      Le magicien peut, en 1 DT, renouveler un sort actif sans faire d’incantation. Ce qui signifie qu’un sort à 3
      réussites qui durait 10 minutes sera renouvelé dès le moment ou le magicien utilisera son atout, et repartira pour
      10 minutes, en conservant ses 3 réussites. Les points d’énergie du sort sont dépensés normalement.
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 3 de l’orientation\_: Magicien)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:persistance-magique
  - id: peur
    term: Peur
    kind: unknown
    prose: >-
      Le personnage provoque la peur chez les autres. Ceux-ci doivent en sa présence faire un test de volonté pour
      maîtriser leur peur. Attention un personnage possédant cet atout s’y voit immunisé. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:peur
  - id: peur-du-noir
    term: Peur du noir
    kind: unknown
    prose: >-
      Le personnage peut lancer une peur du noir sur une personne par niveau. Celles-ci effectuent alors un test de
      volonté pour ne pas être apeurées. Celui qui échouera à ce test se sentira mal à l’aise et essayera (au possible)
      d’aller à un endroit plus éclairer. Cet effet dure 10 minutes par niveau. (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:peur-du-noir
  - id: pied-marin
    term: Pied marin
    kind: unknown
    prose: >-
      Avec de l’élan, le personnage peut se déplacer sur de l’eau (ou toute surfaces liquide), d’un nombre de pas égal à
      son niveau. (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:pied-marin
  - id: pieds-poilus
    term: Pieds poilus
    kind: unknown
    prose: Diminue de 3 la difficulté d’un jet pour se mouvoir silencieusement. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:pieds-poilus
  - id: piegeage-magique
    term: Piégeage magique
    kind: sort
    school_raw: abjuratrice
    prose: >-
      Le magicien lève ses paumes au niveau de son visage et ses doigts se crispent de manière spasmodique tandis qu’il
      récite une formule tout en fixant sa cible. De la poussière jaune tombe alors sur celle-ci, lui infligeant des
      dégâts pour sort qu’elle lancera. La cible reçoit 2 dégâts par réussite du lanceur de sort à chaque fois qu’elle
      termine une incantation. Ces dégâts peuvent être enduré. Le piégeage magique est maintenu pendant 10 minutes par
      niveau de l’abjurateur.
    metadata_raw:
      - (Sort de magie abjuratrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:piegeage-magique
  - id: piege-dos
    term: Piège d’os
    kind: sort
    school_raw: nécromencienne
    prose: >-
      Le magicien lève une main vers le ciel et la faisant tourner sur elle-même psalmodie une formule. Des mains de
      squelettes et de zombies sortent du sol autour des pieds de la cible et le maintiennent sur place. Une main
      apparaît par réussite du sort. Chacune ont une force de 1, ce qui veut dire que pour se libérer du piège, un
      personnage devra faire un jet de force (difficulté standard) avec plus ou autant de réussites que le nombre de
      mains qui le maintiennent. La cible ne peut plus bouger les pieds pendant 10 minutes par niveau du lanceur. Ce
      sort peut être lancé à l’avance comme un piège, emprisonnant ainsi la première cible passant par là. Ce sort doit
      être lancé sur un champ visible au magicien au moment de l’incantation.
    metadata_raw:
      - (Sort de magie nécromencienne)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:piege-dos
  - id: pisteur-ne
    term: Pisteur né
    kind: unknown
    prose: >-
      Le personnage possède un sens du pistage aiguisé et diminue la difficulté de tous les jets basés sur le pistage de
      3. (Permanent).
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:pisteur-ne
  - id: place-a-lombre
    term: Place à l’ombre
    kind: unknown
    prose: >-
      Le personnage peut, à distance (2m/niveau) éteindre, d’un geste de la main, une flamme allant de celle d’une
      bougie à celle d’une torche. Cet atout est utilisable une fois par niveau. (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:place-a-lombre
  - id: polyvalence
    term: Polyvalence
    kind: unknown
    prose: "Le personnage peut désormais choisir ses les atouts de niveaux dans toutes les orientations (les classes et les conditions restent restrictives) jusqu’à un niveau égal à son nombre de point en «\_Polyvalence\_» + 1. Cet atout compte comme atout à part entière et ne permet de choisir un autre atout lorsqu’on le choisit. Par exemple, un guerrier niveau 5 choisit cet atout. Il pourra donc, quand il passera niveau 6, prendre un atout d’artiste niveau 2 (Polyvalence\_: 1 + 1). Il devra reprendre l’atout «\_Polyvalence\_» s’il désire accéder aux atouts de niveau 3 des orientations qui ne sont pas la sienne. Néanmoins, il ne pourra pas choisir l’atout «\_Musique stimulante\_» qui est réservé aux bardes car la polyvalence permet juste d’annuler la barrière de l’orientation."
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:polyvalence
  - id: porte-de-secours
    term: Porte de secours
    kind: unknown
    prose: >-
      Le magicien dessine au doigt les contours d’une porte sur une surface, à l’intérieur de celle-ci sera matérialisée
      une porte ne pouvant être creusé dans 20 cm de profondeur par réussite et disparaîtra au bout de 10 minutes par
      niveau.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:porte-de-secours
  - id: possession
    term: Possession
    kind: unknown
    duration: ephemeral
    prose: >-
      Le personnage peut entrer dans un le corps d’un autre personnage vivant. Celui-ci peut tenter de résister en
      effectuant un jet de volonté avec une difficulté supplémentaire égale au score détenu par le personnage entrant,
      en possession. Une fois entré, le personnage peut rester aussi longtemps qu’il le désire tout en contrôlant ses
      mouvements. Il n’a, par contre, pas accès à ses pensées. Un exorcisme peut faire sortir le personnage de force du
      corps dans lequel il se trouve.
    metadata_raw:
      - (Ephémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:possession
  - id: pouvoir-symbolique
    term: Pouvoir symbolique
    kind: unknown
    duration: permanent
    prose: >-
      Lorsque le personnage prend en main un symbole lié à son culte, celui-ci agit sur une distance égale au niveau du
      personnage. Par exemple un crucifix brûlera un vampire en entrant au contact avec sa peau. Mais si le personnage
      tenant le crucifix possède cet atout, il brûlera le vampire à un mètre par niveau (depuis le crucifix).
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:pouvoir-symbolique
  - id: precision
    term: Précision
    kind: unknown
    prose: Additionne le niveau aux dés lors d’un jet de tir effectuer avec l’arme de prédilection. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:precision
  - id: premonition
    term: Prémonition
    kind: sort
    school_raw: divinatoire
    prose: >-
      Le magicien se met en transe et ferme les yeux. Il penche le visage vers le bas pour commencer, relève la tête
      lentement. Puis il ouvre à nouveau les yeux. Il vit alors un instant avant tout le monde. La vision délivrée est
      celle d’un futur ayant de forte chance d’arriver et non un destin fatal. Une fois la prémonition terminée, le
      lanceur de sort revient au moment exact où il avait terminé son incantation. Ce sort permet d’anticiper le présent
      de 10 DT/R.
    metadata_raw:
      - (Sort de magie divinatoire)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:premonition
  - id: pressentiment-de-la-cible
    term: Pressentiment de la cible
    kind: atout
    orientation: Guerrier
    niveau: 11
    duration: permanent
    prose: "Le personnage à une telle habitude d’être la cible d’attaque qu’il en a développé un sens tout particulier de défense. Sons instinct lui indiquent infailliblement lorsque qu’un projectile, coup, ou autre forme d’agression en vienne à le heurter (même s’il ne peut le voir ou s’il est endormi). Le joueur peut donc choisir l’action de son personnage après avoir été informé qu’un danger le touche. Cet atout ne peut être choisi que si le personnage possède les atouts «\_Détection des coups portants\_» et «\_Détection des projectiles portants\_»."
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 11 de l’orientation\_: Guerrier)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:pressentiment-de-la-cible
  - id: production
    term: Production
    kind: atout
    duration: ephemeral
    prose: Diminue la difficulté de 5 pour la construction d’un objet (dans leur secteur de prédilection).
    metadata_raw:
      - (Ephémère)
      - "(Atout d’orientation\_: Artisan)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:production
  - id: projections-cauchemardesques
    term: Projections cauchemardesques
    kind: unknown
    prose: >-
      En touchant un être, le personnage peut lui faire voir (sous la forme d’un flash) tout le mal que le personnage
      serait prêt à lui faire. Ces visions durent 1 DT par niveaux. (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:projections-cauchemardesques
  - id: protection-divine
    term: Protection divine
    kind: atout
    orientation: Religieux
    niveau: 2
    duration: ephemeral
    prose: >-
      Dévie automatiquement un coup porté. L’utilisation de cet atout doit être décidé juste avant le jet de force de
      l’adversaire.
    metadata_raw:
      - (Ephémère)
      - "(Atout de niveau 2 de l’orientation\_: Religieux)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:protection-divine
  - id: putrefaction
    term: Putréfaction
    kind: sort
    school_raw: nécromantique
    prose: >-
      Le magicien incante une formule dont les fins de phrases semblent incomplètes alors que ses mains tremblantes
      désignent une cible qui commencera à pourrir. La cible reçoit autant de point de dégât que le magicien obtient de
      réussite. Ces dégâts se font sur la durée d’une journée entière. Le processus de putréfaction et des points de
      dégâts recommence les jours suivant et se répète à raison de 1 jour par niveau du lanceur. Donc un magicien de
      niveau 3 obtenant 5 réussites infligera 15 dégâts répartit sur 3 jours. Durant cette période, le sort est actif
      sur la cible. La cible peut soigner ses blessures au fur et à mesure pour ne pas succomber.
    metadata_raw:
      - (Sort de magie nécromantique)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:putrefaction
  - id: race-aquatique
    term: Race aquatique
    kind: unknown
    prose: >-
      Le personnage peut respirer normalement sous l’eau. Ses mouvements ne sont pas ralentis (les facteurs de vitesses
      sont normalement doublés pour les non-aquatiques) et ses jets de nage se font automatiquement avec une difficulté
      diminuée de 3.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:race-aquatique
  - id: rage
    term: Rage
    kind: atout
    niveau: 4
    duration: ephemeral
    prose: >-
      Cet atout permet au personnage d’ignorer tous les malus dus aux coups encaisser, cet état dure un tour (50 DT) par
      niveau.
    metadata_raw:
      - (Ephémère)
      - "(Atout de niveau 4 d’orientation\_: Nomade, réservé à la classe\_: Berzerker)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:rage
  - id: rage-lunaire
    term: Rage lunaire
    kind: unknown
    prose: >-
      Les nuits de pleine lune, le personnage se transforme en Loup-garou. Il ne contrôle plus ses actions et est pris
      d’une furie meurtrière. Le lendemain, le personnage, revenu sous sa forme de base (humain ou loup), ne se souvient
      de rien de ce qu’il a fait et est terriblement fatigué. La rage lunaire est la seule manière, dans un premier
      temps d’accéder à la forme de loup garou (par la suite, des atouts de niveaux peuvent permettre de contrôler cette
      forme ainsi que le changement). Le reste du temps, le personnage le passe sous la forme d’un humain pouvant se
      changer en loup (ou l’inverse). (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:rage-lunaire
  - id: rajeunissement
    term: Rajeunissement
    kind: unknown
    prose: >-
      Le magicien récite lentement une ancienne formule à voix basse. Puis il accélère et se met à articuler de plus en
      plus fort jusqu’à atteindre sa limite, sa cible se met alors à rajeunir. Le corps de celle-ci rajeunis d’une année
      par réussite du lanceur de sort. Ce sort n’élimine aucune trace ou maladie que la cible n’avait pas étant jeune
      par exemple.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:rajeunissement
  - id: ralentissement-magique
    term: Ralentissement magique
    kind: sort
    school_raw: abjuratrice
    prose: >-
      Le magicien incante une formule tout en se consentrant sur l’incantation d’un autre magicien. Se bras décrive de
      large mouvement comme s’il essayait d’étendre quelque chose d’invisible. Le sort de la cible voit son temps
      d’incantation augmenter de 2 par réussite obtenue par l’abjurateur. Ce sort doit donc, évidemment, être lancé
      durant la phase d’incantation du magicien cible.
    metadata_raw:
      - (Sort de magie abjuratrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:ralentissement-magique
  - id: rancune
    term: Rancune
    kind: unknown
    prose: >-
      Pendant un combat chaque point de dégât subit est additionné et compte comme dégât automatique lorsque le
      personnage parvient à toucher celui qu’il l’a blessé. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:rancune
  - id: rappel-de-larme
    term: Rappel de l’arme
    kind: unknown
    prose: >-
      L’arme revient automatiquement dans les mains de son possesseur. Ceci compte pour une action (et dure donc un
      facteur de vitesse). (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
