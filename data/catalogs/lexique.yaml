  - id: regeneration-des-membres
    term: Régénération des membres
    kind: unknown
    duration: permanent
    prose: Le personnage peut régénérer un membre coupé. Le temps de la repousse est de 1 mois moins le niveau du personnage.
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
