        ref: entry:chiropterothropie
  - id: claustrophobie
    term: Claustrophobie
    kind: unknown
    duration: permanent
    prose: >-
      Le personnage craint les espaces étroit et d’être enfermé. Celui-ci devra effectuer un jet de volonté lorsqu’il
      souhaitera combattre cette peur.
    metadata_raw:
      - (Permanent)
      - "(Handicap des races\_: Chigr, Khogr et Khochigr)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:claustrophobie
  - id: cocon-thermique
    term: Cocon thermique
    kind: sort
    school_raw: enchanteresse
    prose: >-
      Le magicien rassemble ses mains en enfermant de l’air entre celles-ci. Puis, il récite une courte formule et
      écarte prestement ses bras. Une bulle jaillit alors dans laquelle la température varie de celle de l’atmosphère.
      Le magicien peut modifier la température d’un maximum de 5°C par réussite obtenue. La bulle prend un rayon de 3
      mètre par niveau du magicien et traverse les obstacles (mûrs, sols, etc). La durée du sort est de 10 minutes par
      niveau du lanceur.
    metadata_raw:
      - (Sort de magie enchanteresse)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:cocon-thermique
  - id: complexite-magique
    term: Complexité magique
    kind: sort
    school_raw: abjuratrice
    prose: >-
      Le magicien incante une formule tout en se concentrant sur l’incantation d’un autre magicien. Ses bras commence à
      battre l’air comme s’il voulait brouiller quelque chose d’invisible. Le sort de la cible voit sa difficulté
      augmenter de 2 par réussite obtenue par l’abjurateur. Ce sort doit donc, évidemment, être lancé durant la phase
      d’incantation du magicien cible.
    metadata_raw:
      - (Sort de magie abjuratrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:complexite-magique
  - id: concentration
    term: Concentration
    kind: unknown
    prose: >-
      Le personnage peut décider de retarder son attaque, diminuant ainsi la difficulté de son jet pour toucher de 1
      pour chaque DT supplémentaire accordé. (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:concentration
  - id: conceptualisation
    term: Conceptualisation
    kind: unknown
    duration: permanent
    prose: >-
      Le personnage peut inventer de nouveau sort propre à sa magie. Le temps nécessaire à la création d’un nouveau sort
      est de 100 jours pour un sort de basse (moins le jet de conceptualisation) (ce nombre varie en fonction du sort
      recherché).
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:conceptualisation
  - id: conceptualisation-etendue
    term: Conceptualisation étendue
    kind: unknown
    duration: permanent
    prose: >-
      Le personnage peut inventer de nouveau sort de n’importe quel type de magie. Le temps nécessaire à la création
      d’un nouveau sort est de 100 jours pour un sort de basse (moins le jet de conceptualisation) (ce nombre varie en
      fonction du sort recherché).
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:conceptualisation-etendue
  - id: condition
    term: Condition
    kind: unknown
    duration: permanent
    prose: >-
      L’objet conçu avec une condition n’actionnera son effet magique que lorsque la condition imposée par celui qui l’a
      crée est remplie (par exemple une épée qui brille seulement en présence des orcs).
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:condition
  - id: connaissance-de-lennemi
    term: Connaissance de l’ennemi
    kind: atout
    orientation: "Guerrier réservé à la classe\_: Duelliste"
    niveau: 5
    duration: permanent
    prose: "Le personnage n’oublie pas les ennemis qu’il a combattus et apprend de fois en fois un peu plus sur leurs techniques de combat respectives. Le personnage gagne un bonus de 1 sur les jets de dès qui entre en opposition avec ceux de son adversaire, pour chaque combat qu’il a déjà mené avec celui-ci. Ces points des bonus sont limités au score de connaissance de l’ennemi du personnage. Par exemple un personnage avec un score de 3 en connaissance de l’ennemi, qui a déjà combattu deux fois le même adversaire aura à présent une difficulté baissée de 2 lorsqu’il combattra à nouveau contre lui. Puis cette difficulté sera baissée de 3 et ne montera pas plus haut tant que le niveau du personnage en «\_Connaissance de l’ennemi\_» ne dépasse pas 3."
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 5 de l’orientation\_: Guerrier réservé à la classe\_: Duelliste)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:connaissance-de-lennemi
  - id: connaisseur
    term: Connaisseur
    kind: unknown
    prose: >-
      Simplement en goûtant, sentant, etc, le personnage est capable de citer les ingrédients d’une potion. Il ne peut
      cependant déterminer que les ingrédients qu’il connaît déjà. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:connaisseur
  - id: connaitre-le-vice
    term: Connaître le vice
    kind: sort
    school_raw: divinatoire
    prose: >-
      Le magicien incante une formule sourde tout en fixant sa cible dans les yeux d’un regard froid et pénétrant. Pour
      finir, il écarquille grand les yeux puis les referme doucement. Il connaîtra alors en les ré ouvrants le plus
      grand vice de sa cible. La cible du sort doit faire un jet d’intelligence. Si le nombre de réussite de celle-ci
      est supérieur au nombre de réussites obtenues par le magicien, alors ce dernier n’aura pas réussi à pénétrer le
      mental de sa cible. Dans le cas contraire, le plus grand vice de la cible peut être révélé au lanceur de sort. Un
      vice est une faiblesse face à un plaisir physique de la vie. Il n’y a aucune quantification du vice, la magicien
      sais juste lequel est son plus grand. Une cible parfaitement pure peut ne pas avoir de vice.
    metadata_raw:
      - (Sort de magie divinatoire)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:connaitre-le-vice
  - id: contact-de-morphee
    term: Contact de Morphée
    kind: sort
    school_raw: divination
    prose: >-
      Après des incantations complexes, le magicien émet un soupir qui libère une faible fumée brune. Lorsque celui-ci
      s’endormira, il rejoindra le rêve de la cible de son sort. Evidement, il faut encore que les deux parties dorment
      en même temps. Le magicien doit avoir eu touché directement sa cible pour réussir à pénétrer son rêve. Si celle-ci
      ne souhaite pas recevoir d’hôtes dans ses rêves, elle peut effectuer un jet d’intelligence.
    metadata_raw:
      - (Sort de divination)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:contact-de-morphee
  - id: contagion
    term: Contagion
    kind: unknown
    prose: "Le personnage est contagieux de par ses morsures ou éventuellement griffure. La maladie transmise est au choix du joueur ou maître de jeu. La difficulté pour guérir de celle-ci est de 7 + le nombre de point en «\_Contagion\_» du personnage. (Permanent)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:contagion
  - id: contagion-du-peche
    term: Contagion du péché
    kind: sort
    school_raw: noire
    prose: >-
      Le magicien lance un regard noir, puis du fin fond de son âme sombre, lui sortent des mots incompréhensibles dont
      la seule écoute suffit à faire pâlir les plus courageux. Ses mains se mettent alors à gesticulées comme si elles
      essayaient de se défaire d'une matière trop poisseuses pour ne pas être inquiétante. Soudain levant les mains
      jointes, il désigne une cible. Le magicien lance sur une cible (distant d'un maximum de 1 mètres par réussite) un
      pêcher de son choix. Celle-ci doit réussir test de volonté avec un malus égal au niveau du lanceur de sort pour ne
      pas subir les effets du sort. Dans le cas contraire, celle-ci acquière un des 7 pêcher capitaux (paresse, orgueil,
      gourmandise, luxure, avarice, colère ou envie) comme trait de personnalité de manière permanente.Une fois la cible
      atteinte, le sort passe aléatoirement à une autre cible distante de la première de 1 mètre par réussite au
      maximum. Le seul moyen d'enrailler ce sort est donc qu'une cible réussisse son test de volonté et brise la chaîne
      ou que le sort passe dans une cible trop isolée pour se transmettre plus loin.Chaque cible après la première
      obtient un pêcher choisi aléatoirement.Le magicien qui lance le sort ne peut être pris pour cible par le sort. Les
      animaux peuvent tout à fait être des cibles.
    metadata_raw:
      - (Sort de magie noire)
    source_refs:
