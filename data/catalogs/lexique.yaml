        ref: entry:cheval-illusoire
  - id: charme-tenebreux
    term: Charme ténébreux
    kind: atout
    race: Vampire
    duration: permanent
    prose: "Le personnage possède, de par son côté obscur, un charme surnaturel. Les personnes (de races «\_compatible\_») sont déstabilisées en sa présence et s’ajoute un malus égal au niveau du personnage à leur jet de volonté lorsque le personnage tente de les séduire."
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 4 de la race\_: Vampire)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
