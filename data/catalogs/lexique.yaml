  - id: reflexion
    term: Réflexion
    kind: atout
    duration: ephemeral
    prose: Cet atout diminue la difficulté d’un jet basé sur l’intelligence de 5.
    metadata_raw:
      - (Ephémère)
      - "(Atout d’orientation\_: Intellectuel)"
