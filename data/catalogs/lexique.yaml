        ref: entry:baiser-de-la-nuit
  - id: baiser-des-tenebres
    term: Baiser des ténèbres
    kind: unknown
    prose: >-
      Le personnage peut après avoir vider un humain d’une partie de son sang, lui faire boire un peu de sang vampirique
      pour transformer sa proie en nouveau vampire. Cette opération peut être faîte en une fois ou sur plusieurs nuits.
      (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
