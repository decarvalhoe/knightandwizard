  - id: arc-en-ciel
    term: Arc-en-ciel
    kind: sort
    school_raw: enchanteresse
    prose: >-
      Le magicien tend une main paume ouverte pour qu’un rayon de lumière en jaillisse. Un arc-en-ciel apparaît à
      l’horizon dans la direction indiquée par la main du mage. L’arc-en-ciel possède un rayon de deux mètres par
      réussites. Ce sort dure 10 minutes par niveau du lanceur.
    metadata_raw:
