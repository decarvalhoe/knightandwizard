  - id: vampire-illusoire
    term: Vampire illusoire
    kind: sort
    school_raw: illusoire
    prose: >-
      Le magicien ferme les yeux et pense à corps de vampire. Sa bouche se met à murmurer une formule tandis que ses
      mains semblent façonner un corps de terre glaise. Dans ses bras apparaît alors un vampire illusoire. Celui-ci
      reste 10 minutes par niveau du lanceur. Cette illusion peut être masculine ou féminine et peut avoir vêtement et
      équipement à sa disposition. La description de l’illusion revient au magicien. Il peut donc décider des créer des
      vampires à l’image d’une personne existante.  Néanmoins, son nombre de réussite influera sur la qualité de son
      résultat.
    metadata_raw:
