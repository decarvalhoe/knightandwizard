    term: Forteresse mentale
    kind: atout
    niveau: 3
    duration: permanent
    prose: "Le personnage possède un lourd passé qu’il a décidé d’enfermer à double tour dans sa mémoire. Lorsqu’un sort ou atout de pénétration mental est lancé sur le personnage (par exemple contrôle mental, vision de rêve, vol de secret, …), celui-ci se fait avec une difficulté supplémentaire égal au niveau du personnage. Si aucun jet n’est demandé (comme pour l’atout «\_Vol de secret\_») un jet d’intelligence de l’intrus se fait avec une difficulté supplémentaire égal au niveau du personnage comme pour les sorts."
