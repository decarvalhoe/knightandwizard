  - id: obstacles-vegetaux
    term: Obstacles végétaux
    kind: sort
    school_raw: naturelle
    prose: >-
      Le magicien, d’un rapide mouvement de bras et par une formule brève mais distincte, indique une cible. Cette
      dernière sera considérée comme antipathique à la nature même et lorsqu’elle souhaitera se déplacée en forêt (ou
      dans d’autre endroit ou il y a de la végétation), les plante s’allieront pour lui barrer le passage (racine qui
      sort de terre juste devant ses pas, branche qui se déplie juste au mauvais moment, etc). La cible du sort vois ses
      jet de mouvement (course, équitation, etc) augmenter de 1 par réussite du magicien, pour autant qu’il se trouve
      dans une zone ou il y a de la végétation en suffisance pour lui faire obstacle. Cet état dure 10 minutes par
      niveau du lanceur de sort.
    metadata_raw:
      - (Sort de magie naturelle)
