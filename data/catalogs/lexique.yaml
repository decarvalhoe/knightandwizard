  - id: auto-regeneration
    term: Auto régénération
    kind: unknown
    prose: >-
      Le corps du personnage se régénère de lui-même en permanence. Ses membres perdus repoussent et ses plaies se
      referment à vue d’œil. Tout les 10 DT, le personnage récupère un point de vitalité. Il ne peut ainsi dépasser son
      nombre de point de vitalité maximum. Cet atout prend fin lorsque le personnage meurt. (permanent)
    source_refs:
