  - id: corrosion-de-masse
    term: Corrosion de masse
    kind: sort
    school_raw: altératrice
    prose: >-
      Le magicien regarde des structures métalliques. Celles-ci se mettent alors à rouiller pendant que le lanceur de
      sort psalmodie une formule en se frottant les mains l’une contre l’autre et qu’une poudre de couleur rouille en
      tombe. Ce sort corrode chacun des objets ciblés à raison de 1kg de métal par réussite. Le nombre de cibles est
      égal au nombre de réussite. Celles-ci doivent toutes se trouver dans le champ de vision du magicien.
    metadata_raw:
