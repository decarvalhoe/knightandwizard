        ref: entry:rappel-de-larme
  - id: rappel-du-familier
    term: Rappel du familier
    kind: unknown
    duration: permanent
    prose: >-
      Permet aux magiciens de rappeler leurs familiers en eux à tout moment. Celui-ci disparaît donc pour une période
      choie par le magicien.
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
