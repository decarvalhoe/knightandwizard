  - id: renvoi
    term: Renvoi
    kind: sort
    school_raw: nécromantique
    prose: >-
      Le magicien fait un large mouvement horizontal du bras tout en récitant une formule d’une voix rauque. Sous son
      geste, les mort-vivants que celui-ci avait rappelé à la vie s’effondrent et retournent à la mort. Le personnage
      peut renvoyer 1 mort par niveau sur une distance de 3 mètres par réussites.
    metadata_raw:
      - (Sort de magie nécromantique)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:renvoi
  - id: renvoi-de-demon
    term: Renvoi de démon
    kind: sort
    school_raw: blanche
    prose: >-
      Le lanceur ouvre dans le sol une faille aspirant un démon dans son propre enfer. Attention car lorsque la porte
      est ouverte d’autres démons peuvent sortir s’ils sont suffisamment puissant. Plus le lanceur de sort fera de
      réussite, plus l’aspiration se fera forte. Un démon devra faire un jet de force (difficulté + 1 par réussite) pour
      ne pas être emporté. Un démon voulant sortir devra tout d’abord se trouver à l’endroit dans l’enfer ou la fissure
      débouche au moment voulu et faire un jet de force à (difficulté + 2 par réussite).
    metadata_raw:
      - (Sort de magie blanche)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:renvoi-de-demon
  - id: renvoi-de-masse
    term: Renvoi de masse
    kind: sort
    school_raw: nécromantique
    prose: >-
      Le magicien fait un large mouvement horizontal du bras tout en récitant une formule d’une voix rauque. Sous son
      geste, les mort-vivants que celui-ci avait rappelé à la vie s’effondrent et retournent à la mort. Le personnage
      peut renvoyer 1 mort par niveau + 1 mort par réussites supplémentaires à la première, sur une distance de 3 mètres
      par réussites.
    metadata_raw:
      - (Sort de magie nécromantique)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:renvoi-de-masse
  - id: repondre-a-linsulte
    term: Répondre à l’insulte
    kind: unknown
    duration: permanent
    prose: >-
      Le personnage peut s’ajouter son niveau en nombre de dés lorsqu’il frappe sur quelqu’un l’aillant insulté. Les dés
      gagnés de la sorte peuvent êtres répartis au gré du joueur dans ses aptitudes physiques. Cet état dure jusqu'à ce
      que l’insolent ait reçu la correction qu’il mérite.
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:repondre-a-linsulte
  - id: repos-du-guerrier
    term: Repos du guerrier
    kind: unknown
    prose: Le personnage récupère le double de point de vitalité lors d’une nuit de sommeil. (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:repos-du-guerrier
  - id: repulsion
    term: Répulsion
    kind: atout
    orientation: Magicien
    niveau: 5
    duration: permanent
    prose: "Le personnage arrive à canaliser son énergie pour la libérer dans une direction bien précise. Généralement c’est de la paume de la main que sors cette force invisible qui repousse les corps. La portée de cette force (comparable à celle d’un vent) est de 1 mètre par niveau du magicien. Tout personnage pris dans la répulsion doit faire un jet de force pour ne pas être éjecté. La difficulté  du jet de force est de 1 par point d’énergie dépensé. Donc si un magicien dépense 7 point d’énergie, la difficulté du jet sera de 7. Cet atout ne peut être choisit que si le personnage possède l’atout «\_Libération d’énergie\_»."
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 5 de l’orientation\_: Magicien)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:repulsion
  - id: resistance
    term: Résistance
    kind: unknown
    duration: permanent
    prose: >-
      Les résistances sont représentées en pourcentage, ce qui signifie qu’une résistance de 100 équivaut à une immunité
      à la chose en question. Pour faire valoir sa résistance, il faut obtenir un nombre inférieur ou égal au point de
      résistance du personnage sur un D100. Lors d’une résistance réussie, les effets de la chose à laquelle s’oppose la
      résistance sont ignorés.
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:resistance
  - id: resistance-selective
    term: Résistance sélective
    kind: atout
    niveau: 2
    duration: permanent
    prose: >-
      Cet atout permet au personnage de choisir s'il souhaite ou non utiliser sa résistance. Evidemment, pour choisir
      cet atout, il faut avoir au minimum une résistance à quelque chose.
    metadata_raw:
      - (Permanant)
      - (Atout de niveau 2)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:resistance-selective
  - id: respiration-magique
    term: Respiration magique
    kind: unknown
    prose: >-
      Le mage forme d'un doigt une croix sur sa bouche ou celle de sa cible. Celle-ci peut alors respirer normalement
      quelles que soient les conditions (sous l’eau, dans un nuage de poison, …). Cet état dure 10 minutes par réussite
      du lanceur de sort.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:respiration-magique
  - id: respiration-magique-de-masse
    term: Respiration magique de masse
    kind: unknown
    prose: >-
      Le mage forme d'un doigt une croix sur sa bouche et désigne de la main ses cibles. Celles-ci peuvent alors
      respirer normalement quelles que soient les conditions (sous l’eau, dans un nuage de poison, …). Cet état dure 10
      minutes par réussite du lanceur de sort et affecte 1 personnage par réussite.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:respiration-magique-de-masse
  - id: ressentir-la-magie
    term: Ressentir la magie
    kind: unknown
    prose: Permet au magicien de ressentir le rayonnement de la magie sur un rayon d’un mètre par niveau. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:ressentir-la-magie
  - id: ressentir-la-trace-du-mal
    term: Ressentir la trace du mal
    kind: unknown
    prose: >-
      Permet au personnage de ressentir la présence du mal que se soit une personne, un acte ou autre. Plus le mal est
      grand, et plus le personnage le  ressentira fort au fond de lui. De plus, le personnage peut ressentir la trace
      d’un mal ayant été à l’endroit ou il se trouve.  Par exemple, un personnage se trouvant là ou un démon à foulé le
      sol, pourra encore ressentir sa trace. L’importance de cette sensation est fonction du mal en question. Le
      personnage sait si le mal qu’il ressent ai dû à un événement passé ou présent.(permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:ressentir-la-trace-du-mal
  - id: ressentir-larme
    term: Ressentir l’arme
    kind: unknown
    prose: >-
      Le personnage peut d’instinct ressentir une arme à proximité de lui. Par exemple, si un personnage cache un
      couteau dans sa botte, il ne saura pas qu’il s’agit d’un couteaux, mais son instinct lui soufflera de se méfier de
      cette botte. Ceci agit sur un rayon d’un mètre par niveau. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:ressentir-larme
  - id: ressentir-le-magicien
    term: Ressentir le magicien
    kind: unknown
    prose: Permet au magicien de ressentir la présence d’autres magiciens sur une distance d’un mètre par niveau. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
