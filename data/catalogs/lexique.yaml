        ref: entry:mort-dans-le-sillage
  - id: mort-temporaire
    term: Mort temporaire
    kind: sort
    school_raw: nécromantique
    prose: >-
      Le magicien entame une formule ressemblant fortement à un cantique tout en regardant à terre et en balançant sa
      tête de droite à gauche. Soudain, il s’arrête au milieu d’une phrase et relève la tête brusquement en fixant sa
      cible dans les yeux. Celle-ci tombe alors morte pour un moment. La cible du sort doit faire un jet d’endurance. Si
      le magicien obtient plus de réussite dans son sort que la cible, alors celle-ci tombera morte pour une durée de 10
      minutes par niveau du lanceur de sort. Après ce laps de temps, la cible se réveille comme après un mauvais
      cauchemar.
    metadata_raw:
      - (Sort de magie nécromantique)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:mort-temporaire
  - id: mort-vivant
    term: Mort-vivant
    kind: unknown
    prose: >-
      En tant que mort, le personnage ne respire plus, son cœur ne bat plus, son teint s’éclaircit et sa peau se
      refroidit. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
