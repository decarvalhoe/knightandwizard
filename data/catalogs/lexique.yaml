  - id: maitrise-de-lenergie
    term: Maîtrise de l’énergie
    kind: atout
    orientation: Magicien
    niveau: 15
    duration: ephemeral
    prose: "Cet atout modifie l’atout «\_Energie à l’honneur\_» de la manière suivante\_: Le personnage teint l’air qui l’entoure de la couleur de sa magie dans un rayon égal à son niveau en mètre. Cette couleur est nettement plus intense que dans le simple «\_Energie à l’honneur\_». Dans cet environnement les sorts de la couleur maîtrisées voient leurs difficultés baissées de 1 pendant 10 minutes/niveau. Ce bonus ne s’applique pas au magicien qui lui bénéficie d’un bonus égal à son niveau. Maîtriser une énergie prend 10DT non réductible. Cet atout modifie de manière permanente l’\_«\_Energie à l’honneur\_» qui lui reste éphémère, ce qui signifie que passer d’un atout à l’autre n’amène pas de point supplémentaire dans l’atout."
    metadata_raw:
      - (Ephémère)
      - "(Atout de niveau 15 de l’orientation\_: Magicien)"
    source_refs:
