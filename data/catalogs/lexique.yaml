  - id: illusion
    term: Illusion
    kind: unknown
    prose: "Ce type de magie agit sur les sens de la perception. Le magicien qui lance un tel sort crée une illusion comme on peint un tableau. Plus ses réussites seront élevées, plus il sera difficile de faire la nuance entre l’illusion et la réalité. Les illusions ne peuvent influer sur la réalité, par contre elle peuvent donner l’illusion de le faire. Par exemple un feu illusoire donnera l’illusion de brûler celui qui passera son bras dedans, néanmoins ce personnage n’aura pas de point de dégât et retrouvera son bras d’origine lorsque l’illusion se sera dissipée ou qu’il aura pris conscience de l’illusion. Une illusion est toujours lancé dans le champ de vision du magicien. Une illusion lancée se fait toujours sur un sens à la fois. Ainsi chaque sorts peut être lancé cinq fois par illusion afin que celle-ci soit dite parfaite. Pour prendre conscience d’une illusion, un personnage doit réussir un jet de perception ou intelligence (selon le cas) et obtenir au moins autant de réussite que le magicien en a eu lorsqu’il a lancé son sort. Dès lors il doit encore réussir un test de volonté. Ce test possède un malus de 1 par sens ajouté à une illusion en plus du premier. Ce qui signifie qu’un test de volonté pour réaliser la «\_non-réalité\_» d’une illusion aura au maximum un malus de 4."
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:illusion
