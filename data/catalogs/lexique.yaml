        ref: entry:pas-leger
  - id: passage-a-lombre
    term: Passage à l’ombre
    kind: unknown
    prose: >-
      Permet au personnage d’entrer intégralement dans sa propre hombre et de se déplacer ainsi ou bon lui semble. C’est
      état peut durer jusqu’à une minute par niveau maximum. (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:passage-a-lombre
  - id: passage-au-familier
    term: Passage au familier
    kind: atout
    orientation: Magicien
    niveau: 6
    duration: ephemeral
    prose: >-
      Cet atout permet au personnage d’entrer intégralement dans son familier et d’en sortir quand, et ou bon lui
      semble.
    metadata_raw:
      - (Ephémère)
      - "(Atout de niveau 6 de l’orientation\_: Magicien)"
