  - id: corrosion
    term: Corrosion
    kind: sort
    school_raw: altératrice
    prose: >-
      Le magicien regarde une structure métallique. Celle-ci se met alors à rouiller pendant que le lanceur de sort
      psalmodie une formule en se frottant les mains l’une contre l’autre et qu’une poudre de couleur rouille en tombe.
      Ce sort corrode un objet à raison de 1kg de métal par réussite. La cible doit être dans le champ de vision du
      magicien.
    metadata_raw:
      - (Sort de magie altératrice)
    source_refs:
