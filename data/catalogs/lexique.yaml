    kind: unknown
    duration: permanent
    prose: >-
      La vision est représentée en pourcentage, ce qui signifie qu’un homme en bonne forme possède une vision de 100%.
      Un personnage ayant 200% en vision verra donc deux fois plus loin et plus précisément.
    metadata_raw:
