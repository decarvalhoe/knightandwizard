  - id: baiser-vivifiant
    term: Baiser vivifiant
    kind: unknown
    prose: >-
      Le personnage peux rendre un nombre de point de vitalité égal à son niveau, simplement en embrassant la personne
      qu’il aime. (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
