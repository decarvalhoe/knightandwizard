  - id: irreductibilite
    term: Irréductibilité
    kind: unknown
    prose: "Le magicien incante un sort en levant son bras, main grande ouverte et en désignant un autre magicien de la paume. Un mince jet de poussière jaune jaillit de celle-ci et va se répandre sur sa cible. Cet dernière ne pourra alors plus réduire le temps d’incantation de ses sorts en dessous de 1 + le nombre de réussite qu’a obtenu le lanceur de «\_l’irréductibilité\_». Ce sort reste actif 10 minutes par niveau du lanceur."
    metadata_raw:
