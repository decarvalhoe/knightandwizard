        ref: entry:chigr-illusoire
  - id: chiropterothropie
    term: Chiroptèrothropie
    kind: atout
    race: Vampire
    duration: permanent
    prose: >-
      Permet au personnage de se changer en chauve-souris. La transformation prend 50 DT (soit 10 secondes). La forme de
      la chauve-souris est considérée comme un personnage secondaire.
    metadata_raw:
      - (Permanent)
      - "(Atout de la race\_: Vampire)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
