  - id: detection-des-coups-portants
    term: Détection des coups portants
    kind: atout
    orientation: Guerrier
    niveau: 4
    duration: permanent
    prose: >-
      Le personnage a une telle habitude du combat que son instinct lui indique automatiquement si un coup donné dans sa
      direction en corps à corps le touchera ou non. Le joueur peut donc savoir si son adversaire le touche avant de
      décider de son action (esquive, parade, continuer sa propre action, etc). Cet atout ne peut être choisit que si le
      personnage possède un score minimum de 4 en perception. La détection des coups portant ne s’applique qu’aux coups
      donnés en corps à corps et que le joueur peut voir.
