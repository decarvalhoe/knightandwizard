  - id: dryade-illusoire
    term: Dryade illusoire
    kind: sort
    school_raw: illusoire
    prose: >-
      Le magicien ferme les yeux et pense à corps de dryade. Sa bouche se met à murmurer une formule tandis que ses
      mains semblent façonner un corps de terre glaise. Dans ses bras apparaît alors une dryade illusoire. Celui-ci
      reste 10 minutes par niveau du lanceur. Cette illusion peut avoir des vêtements et équipement à sa disposition. La
      description de l’illusion revient au magicien. Il peut donc décider des créer des dryades à l’image d’une
      personnage existant.  Néanmoins, son nombre de réussite influera sur la qualité de son résultat.
