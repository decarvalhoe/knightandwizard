    term: Enchantement de livre
    kind: sort
    school_raw: enchanteresse
    prose: >-
      Le livre enchanté se met à léviter, s’ouvre et se met à se lire lui même à haute voix, le caractère et la voix du
      livre dépendent de son contenu. Se sort dure 10 minutes par réussite.
    metadata_raw:
      - (Sort de magie enchanteresse)
