        ref: entry:rappel-du-familier
  - id: recharge-rapide
    term: Recharge rapide
    kind: atout
    niveau: 2
    duration: permanent
    prose: >-
      Cet atout diminue de 1  DT le temps nécessaire au chargement d’une arme de distance. Ce temps ne peut être
      descendu en dessous de 1. Réanimation des
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 2 des classes\_: Arbalétrier, Archer)"
