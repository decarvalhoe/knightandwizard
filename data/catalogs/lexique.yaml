        ref: entry:vide-sideral
  - id: vieillissement
    term: Vieillissement
    kind: sort
    school_raw: nécromantique
    prose: >-
      Le magicien entame une incantation qui semble ralentir au fur et à mesure qu’il la prononce. D’un doigt tremblant
      et en crochet, il désigne une alors une cible qui commence à vieillir à vue d’œil. Pour ne pas subir les effets de
      ce sort, la cible peut effectuer un jet d’endurance. Si ses réussites sont plus nombreuses que celle du magicien,
      alors le sort n’aura aucun effet sur elle. Dans le cas contraire, la cible vieillit de manière que celle-ci subit
      un malus de -1 dans toutes ses aptitudes. On ne peut passer une aptitude en dessous de 0. Attention, le sort ne
      tue pas. Même si une cible atteint 0 dans toutes ses aptitudes, on considèrera que celle-ci ne tient plus sur ses
      jambes et ne peut plus être autonome, néanmoins elle n’en sera pas morte pour autant. Cet état de vieillesse reste
      sur la cible pendant 10 minutes par niveau du lanceur de sort. Le sort doit évidemment être lancé sur des êtres
      vivants (ce qui exclu donc les morts vivants).
    metadata_raw:
      - (Sort de magie nécromantique)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:vieillissement
