        ref: entry:auto-regeneration
  - id: auto-soin
    term: Auto soin
    kind: unknown
    prose: >-
      Soigne les blessures du personnage, par sa propre concentration. La vitalité ainsi récupérée est égale au niveau.
      (éphémère)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:auto-soin
  - id: autodidacte
    term: Autodidacte
    kind: unknown
    prose: >-
      Le personnage peut apprendre par lui-même des sorts qu’il a vu et entendu incanter. Le temps d’apprentissage est
      le double du temps normal (moins le jet d’autodidacticité). Cet atout ne peut être donné à un chaman. (permanent)
    source_refs:
