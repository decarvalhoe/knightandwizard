        ref: entry:autodidacte
  - id: sans-reflet
    term: Sans reflet
    kind: unknown
    prose: Le personnage n’a aucun reflet, que ce soit dans l’eau, dans un miroir, … (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
