    term: Sommeil
    kind: unknown
    prose: >-
      Une fois le sort incanté, le magicien doit entrer en contact physique avec une cible qui devra réussir un test de
      volonté, auquel sera déduit les réussites du magicien, pour ne pas s’endormir.
