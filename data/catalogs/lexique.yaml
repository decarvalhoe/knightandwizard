  - id: substitution-de-sort
    term: Substitution de sort
    kind: sort
    school_raw: abjuatrice
    prose: >-
      Le magicien fixe un autre magicien en pleine incantation tout en incantant à voix basse son propre sort. Tout en
      récitant sa formule magique, il pensera à un autre sort qu’il connaît. Sa cible se mettra alors à incanter ce sort
      sans même s’en rendre compte, en proie à une sorte de transe. Le magicien remplace le sort qu’un autre magicien
      incante par un sort qu’il connaît. Pour ne pas subir cette subsitution de sort, la cible peux faire un jet
      d’intelligence et doit obtenir autant (ou plus) de réussite que l’abjurateur en à eu lorsqu’il à lancer la
      substitution magique. Ce sort doit impérativement être lancé lorsque la cible est encore en incantation. Si  Les
      points d’énergie, la difficulté sont modifié pour la cible comme s’il avait lancé le sort choisit par l’abjurateur
      en le connaissant. Si l’énergie dépensée par le nouveau sort excède les points d’énergie restants du magicien
      ciblé, alors l’incantation est réduit à néant et aucun effets n’auront lieux (le sort de substitution à, lui
      toutefois été lancé).
    metadata_raw:
      - (Sort de magie abjuatrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:substitution-de-sort
