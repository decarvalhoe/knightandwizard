    kind: sort
    school_raw: enchanteresse
    prose: >-
      Le magicien incante une formule tout en se frottant rapidement le corps des mains. Sa voix se fait de plus en plus
      faible jusqu’à disparaître. Son corps lui aussi disparaît sous les frottements vigoureux. Bientôt le personnage
      est totalement invisible. Les jets de vue pour voir la cible du sort possède un malus égal au nombre de réussites
      du sort. Cet état dure 10 minutes par niveau du lanceur.
