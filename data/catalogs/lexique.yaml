  - id: interdiction-magique
    term: Interdiction magique
    kind: sort
    school_raw: abjuratrice
    prose: >-
      Le magicien se concentre sur l’incantation une incantation effectuée par un autre magicien. Il lève sa main droite
      devant lui, paume perpendiculaire au sol, et prononce des phrases ressemblant à des ordres. Le sort ciblé par
      l’abjurateur n’est plus utilisable par le magicien ciblé. Si celui-ci ne veux pas subir l’interdiction magique, il
      peut faire un jet d’intelligence et doit obtenir autant (ou plus) de réussites que l’abjurateur. Cette
      interdiction dure 10 minutes par niveau de l’abjurateur.
    metadata_raw:
      - (Sort de magie abjuratrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:interdiction-magique
  - id: inversion-des-energies
    term: Inversion des énergies
    kind: atout
    orientation: Magicien
    niveau: 12
    duration: permanent
    prose: >-
      Le personnage possède un tel niveau de maîtrise en magie qu’il peut inverser sens dans lequel l’énergie le
      traverse lorsqu’il incante un sort. Cette pratique très risquée à but de lancer des sorts sans utiliser d’énergie.
      Le personnage peut choisir de lancer ses sorts soit avec ses point d’énergie, soit avec ses points de vitalité. Le
      mélange des deux pour une même incantation n’est pas permis.
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 12 de l’orientation\_: Magicien)"
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
