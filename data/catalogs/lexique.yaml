  - id: baiser-salvateur
    term: Baiser salvateur
    kind: atout
    niveau: 18
    duration: ephemeral
    prose: "Le personnage peut, simplement en embrassant la personne qu’il aime, rendre la vie à celle-ci. La mort du personnage ramené ne doit pas être plus ancienne qu’une minute par niveau du personnage la ramenant. Cet atout ne peut être pris qu’à condition d’avoir l’atout l’atout «\_Baiser vivifiant\_»."
    metadata_raw:
      - (Ephémère)
      - (Atout de niveau 18)
