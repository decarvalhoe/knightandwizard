  - id: enfant-de-lelement
    term: Enfant de l’élément
    kind: unknown
    duration: permanent
    prose: "Cet atout est à choisir avec un élément (eau, feu, terre, pierre, glace, air, etc) Les éléments sont toujours matériels (pas d’ombre ou de lumière par exemple). L’élément reconnaît dans le personnage un de ses enfants. Ainsi, cet élément se tordra, se déformera, se déplacera, etc pour aider le personnage. Par exemple un fils du feu passera dans des flammes sans être brûler car celles-ci s’écarteront de lui pour ne pas lui faire de mal (ce qui ne le protège pas de la chaleur ni de la fumée toutefois). Un personnage ne peut être l’enfant de plusieurs éléments. Cet atout ne peut être choisit avec l’atout «\_Enfant de la nature\_» ou «\_Totem\_»."
    metadata_raw:
      - (Permanent)
    source_refs:
