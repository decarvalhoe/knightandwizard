  - id: energie-au-deshonneur
    term: Energie au déshonneur
    kind: atout
    orientation: Magicien
    niveau: 4
    duration: ephemeral
    prose: >-
      Une vague jaune d’énergie s’extirpe du personnage en chassant une autre couleur dans un rayon égal au niveau du
      magicien en mètre. Dans cet environnement, tout sort lancé de la magie au déshonneur (choisie par le magicien
      lorsqu’il active son atout) verra sa difficulté augmenter de 1 pendant 10 minutes/niveau. Mettre une énergie au
      déshonneur prend 10DT non réductible. Cet atout ne peut être choisit que par les abjurateurs.
