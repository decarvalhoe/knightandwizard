    term: Né pour tuer
    kind: atout
    orientation: Guerrier
    niveau: 3
    duration: permanent
    prose: "Le personnage apprend de nouvelle technique de combat ou utilisation d’arme, avec une aisance déconcertante. Le nombre de jours de son apprentissage sont divisés par son niveau en «\_Né pour tuer\_» + 1. Soit s’il n’a qu’un point dans cet atout, ses jours d’apprentissage seront divisés de moitié."
