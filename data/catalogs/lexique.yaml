  - id: mobilisation-post-mortem
    term: Mobilisation post-mortem
    kind: atout
    niveau: 2
    duration: permanent
    prose: "Lorsque le personnage fait un appel des morts, le nombre de revenant peut être au maximum de\_: son niveau X (mobilisation post-mortem + 1). Autrement dis si un magicien ne possède pas cet atout, il relèvera son niveau au maximum de morts, s’il possède un points en mobilisation post-mortem, il relèvera 2X fois son niveau, puis trois fois s’il reprend à nouveau l’atout mobilisation post mortem, et ainsi de suite."
    metadata_raw:
      - (Permanent)
      - '(Atout de niveau 2 de la classe : Nécromancien)'
