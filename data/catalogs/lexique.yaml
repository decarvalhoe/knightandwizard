      cibles du sort (visuelles, olfactives, gustatives) à partir du point au le sort à été lancé et ce, pendant 10
      minutes par niveau du lanceur de sort. La difficulté pour pister les cibles du sort sera alors augmentée de 1 par
      réussite obtenue par le magicien. Le magicien peut choisir une cible par réussite obtenue. Notez qu’une cible peut
      être un objet (par exemple une charrette) et qu’il faut bien sûr un minimum de végétaux à proximité pour que ce
      sort soit efficace.
