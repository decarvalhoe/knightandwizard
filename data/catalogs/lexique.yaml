    term: Rire
    kind: sort
    school_raw: enchanteresse
    prose: >-
      Le magicien lève ses mains puis commence à rire aux éclats. Des confettis tombent gentiment du ciel, mettant la
      cible dans un état d'hilarité avancé. La cible doit faire un test de volonté (difficulté + les réussites du
      magicien) pour ne pas être affectée par le sort. Une cible affectée vera la difficulté de tout ses jet de dès 
      augmenter de 1 de difficulté par tranche de 2 réussites obtenue du magicien. Ce sort dure 10min par niveau.
