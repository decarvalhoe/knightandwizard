        ref: entry:martyrisation
  - id: mecanisme-dautodefense
    term: Mécanisme d’autodéfense
    kind: atout
    niveau: 3
    duration: permanent
    prose: >-
      Le personnage a vécut une expérience si traumatisante qu’il génère un mécanisme d’autodéfense lorsque les
      circonstances font que ses mauvais souvenirs resurgissent. Dès lors, le personnage gagne son niveau en dès
      supplémentaire pour toutes actions lui permettant de mettre un terme aux circonstances lui rappelant sa tragique
      histoire. Par exemple pour s’enfuir ou pour frapper quelqu’un qui parle trop. Cet atout ne peut être choisit que
      si le personnage à subit un traumatisme.
    metadata_raw:
      - (Permanent)
      - (Atout de niveau 3 accessible sous condition)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
