        ref: entry:passe-partout
  - id: paysannerie
    term: Paysannerie
    kind: unknown
    duration: ephemeral
    prose: Diminue la difficulté de 5 lors d’un jet basé sur la paysannerie (dans le domaine de prédilection).
    metadata_raw:
      - (Ephémère)
