  - id: auto-clonage
    term: Auto clonage
    kind: unknown
    prose: >-
      Le magicien en incantant d’une voie gutturale, presque interne, semble sculpter son propre corps de ses mains. Des
      clones du lanceur apparaissent alors, 1 par réussite. Ce sort dure 10 minutes par niveaux du magicien.
