  - id: aube-petrificatrice
    term: Aube pétrificatrice
    kind: unknown
    prose: >-
      Les rayons du soleil change le personnage en pierre. Un personnage ainsi statufié ne reviens pas à son état normal
      une fois la nuit venue. (permanent)
    source_refs:
