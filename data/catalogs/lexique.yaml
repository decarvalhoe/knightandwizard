    term: Souvenir de la bête
    kind: atout
    niveau: 3
    duration: permanent
    prose: >-
      Le personnage arrive à se souvenir de se qu’il a fait les soirs de pleine lune lorsqu’il était changé en
      Loup-garou, mais n’arrive pas encore à maîtriser ce qu’il fait lorsqu’il est dans cet état.
    metadata_raw:
