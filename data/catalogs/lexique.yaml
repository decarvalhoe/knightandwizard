  - id: corruption-de-lair
    term: Corruption de l’air
    kind: sort
    school_raw: nécromancie
    prose: >-
      Le magicien incante une sombre formule tout en remuant grandement les bras, semblant désigné le monde qui
      l’entoure avec dédain. Puis portant ses mains à son visage comme pour faire porte-voix, il crache un gaz grisâtre
      de sa bouche et de ses narines. Tout être respirant cet air contaminé subira le poison mortel. Le nuage de poison
      fait 5 mètres3 par réussites du magicien et inflige 2 dégâts d’énergie (endurable) par réussite. Tout être
      respirant entrant dans le nuage subit directement les dégâts de celui-ci. Ces dégâts lui seront renouvelés toutes
      les 10 secondes (50 DT) a moins que celui-ci ne s’en aille de la zone mortelle. Le nuage peut être projeté à
      distance par le magicien aussi loin que porte sa vue et se maintient 10 minute par niveau du lanceur.
    metadata_raw:
      - (Sort de nécromancie)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:corruption-de-lair
  - id: corruption-de-leau
    term: Corruption de l’eau
    kind: sort
    school_raw: nécromancie
    prose: >-
      Le magicien incante une sombre formule tout en remuant de ses bras la surface de l’eau avec dédain. Puis il crache
      un liquide grisâtre de sa bouche et de ses narines. Tout être vivant nageant dans cette eau contaminée subira le
      poison mortel. Le liquide empoisonné s’étends sur 5 mètres3 par réussites du magicien et inflige 2 dégâts
      d’énergie (endurable) par réussite. Tout être vivant entrant dans le liquide subit directement les dégâts de
      celui-ci. Ces dégâts lui seront renouvelés toutes les 10 secondes (50 DT) a moins que celui-ci ne s’en aille de la
      zone mortelle. Le liquide peut être projeté à distance par le magicien aussi loin que porte sa vue et se maintient
      10 minute par niveau du lanceur.
    metadata_raw:
      - (Sort de nécromancie)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:corruption-de-leau
  - id: corruption-vegetale
    term: Corruption végétale
    kind: sort
    school_raw: nécromancie
    prose: >-
      Le magicien regarde autour de lui, et dans une grimace, fait un geste dédaigneux de la main tout en marmonnant une
      sombre formule. Les fleurs tous autours de lui se mettent alors à se faner, les herbes sèches et les arbres se
      meurent. Le magicien inflige 2 dégâts par réussites aux plantes qui l’entourent sur un rayon de 3 mètres par
      niveau.
    metadata_raw:
      - (Sort de nécromancie)
