  - id: detournement-du-lien-du-mort-vivant
    term: Détournement du lien du mort-vivant
    kind: sort
    school_raw: abjuratrice
    prose: >-
      Le magicien met ses mains sur le côté de son visage et scrute un mort-vivant. Il visualise le lien qui le rattache
      à son propriétaire et le suis des yeux. Canalisant son énergie, il tire mentalement sur cette fibre magique pour
      en voir le bout et dès qu’il apparaît, le colle du regard à un nouveau propriétaire de son choix. Le contrôle de 1
      mort-vivant par niveaux du lanceur de sort est attribué à une nouvelle cible si le nombre de réussites obtenues
      est supérieur aux réussites obtenues lors de l’appel du mort. Le sort ne peux être lancer que sur des mort-vivant
      sous contrôle d’un magicien (squelette, zombie, et tout les morts qui ont été rappelés magiquement). Rappelons
      encore que le sort ne peux être lancé que sur 1 sort à la fois. Ainsi, si un groupe de 8 squelettes appelé en deux
      fois par un nécromancien (disons 2 x 4) subit un détournement du lien du mort vivant, et que l’abjurateur est de
      niveau 5, il ne pourra détourner qu’un maximum de 4 squelettes, puisque le sort d’abjuration est au final lancé
      sur le sort d’appel et non sur les créatures.
    metadata_raw:
      - (Sort de magie abjuratrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:detournement-du-lien-du-mort-vivant
