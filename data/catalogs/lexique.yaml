    term: Aura maléfique
    kind: unknown
    prose: >-
      Le personnage dégage une aura qui empêche tout sort de magie blanche d’être incantée sur un rayon d’un mètre par
      niveau par niveau, par un magicien d’un niveau inférieur. (permanent)
