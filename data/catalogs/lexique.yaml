  - id: enfant-de-la-nature
    term: Enfant de la nature
    kind: atout
    niveau: 2
    duration: permanent
    prose: >-
      La nature reconnaît dans le personnage un de ses enfants. Ainsi, les végétaux se tordent pour aider le personnage,
      les racines se retirent devant ses pieds, les branches des arbres le protègent de la pluie et du soleil, etc. Cet
      atout ne peut être choisit avec l’atout Enfant de l’élément.
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 2 de la classe\_: Druide)"
