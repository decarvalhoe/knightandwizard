        ref: entry:deplacement-magique
  - id: deplacement-magique-de-masse
    term: Déplacement magique de masse
    kind: sort
    school_raw: abjuratrice
    prose: "Le mage semble tirer sur quelque chose qui se trouverait devant lui. Une main immatérielle jaune apparaît au-dessus de sa cible, et imite les mouvements de la main de mage. Le sort qui est «\_déplacé\_» se voit sous la forme d’une masse nébuleuse de la couleur du sort en question. Une fois le sort attrapé, la main va le relâcher sur la nouvelle cible. Une main «\_travaille\_» à la fois par R. Pour que le sort fonctionne, le magicien doit obtenir, au moins, le même nombre de réussites que celui que possède le sort sur lequel il opère."
    metadata_raw:
      - (Sort de magie abjuratrice)
    source_refs:
