      par niveau), toutes personnes lui infligeant des dégâts volontairement reçoivent, eux ainsi que leur compagnons
      (dans un rayon de 3 mètre par niveau) en retour un nombre de point de dégât égal au nombre de réussites qu’à fait
      le lanceur du sort, lors de son incantation.
