  - id: touche-mortel
    term: Touché mortel
    kind: unknown
    prose: "Le magicien entame une incantation inquiétante dont les sons semblent faire vaciller les lumières et les couleurs. Ses yeux se révulsent et la paume d’une de ses mains devient alors plus froide que la glace. Soudain un claquement sec de dent interrompt l’incantation et le lanceur retrouve ses yeux normaux. Sa main, par contre, reste glaciale et devient un instrument de mort pour quiconque entrera en contact avec elle. Après avoir lancé le sort le magicien conserve l’état de «\_touché mortel\_» pendant 10 minutes par niveaux. Au-delà de ce temps, le sort se dissipe. Pour ne pas subir les effets de ce sort, la cible peut effectuer un jet d’endurance. Si ses réussites sont plus nombreuses que celle du magicien, alors le sort n’aura aucun effet sur elle. Dans le cas contraire, la cible touchée par la main du magicien meurt instantanément. Le sort ne peut agir que sur une seule cible, après quoi, la main du magicien reprend petit à petit sa température naturelle."
    metadata_raw:
      - (Sort ultime de magie nécromantique)
    source_refs:
