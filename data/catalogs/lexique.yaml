  - id: familier
    term: Familier
    kind: atout
    duration: permanent
    prose: >-
      Le personnage est aidé d’une créature qui peut prendre n’importe quelle forme. Celle-ci n’a cependant que 5 point
      de vitalité par niveau du personnage (ce qui signifie que c’est avec ceux-ci que le familier peut évoluer en de
      plus grosse créatures). A chaque passage de niveau, le familier renaît, ce qui implique qu’il peut décider de
      conserver sa forme ou de la solder pour une autre au choix du personnage, c’est aussi comme cela qu’il est
      possible de récupérer un familier mort. Le personnage peut décider d’investir des points d’expérience pour ajouter
      des compétences et spécialisations à son familier, mais si toutefois celui-ci devait mourir, ces points seraient
      perdus.
    metadata_raw:
      - (Permanent)
      - "(Atout d’orientation\_: Magicien)"
    source_refs:
