  - id: regard-du-guerrier
    term: Regard du guerrier
    kind: atout
    niveau: 3
    duration: permanent
    prose: >-
      Le personnage possède un regard de combattant aguerrit et les gens le ressentent, même s’ils ne comprennent pas
      toujours pourquoi. Les personnages peuvent faire un jet de volonté avec le niveau du guerrier comme difficulté
      supplémentaire pour ne pas êtres intimidés. Cet atout ne peut être choisit que si le personnage possède un
      charisme minimum de 4.
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 3 d’orientation\_: Guerrier)"
