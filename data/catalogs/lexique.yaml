  - id: creation-de-membre
    term: Création de membre
    kind: sort
    school_raw: altératrice
    prose: >-
      Les yeux du mage deviennent rouges et, de ses mains, il crée la forme d’un membre. La peau de la cible se troue à
      l’endroit adéquat, puis une forme rougeâtre se crée graduellement, jusqu’à devenir le membre souhaité. Les os,
      muscle, nerf et enfin la peau se soudent avec le nouveau membre ainsi qu’à l’endroit où la peau s’est trouée. Le
      membre rendu est (tant que possible) adapté à la cible. Ce qui veux dire qu’un homme lézard aura des membre
      couvert d’écailles et un humain de peau humain par exemple. Le temps d’adaptation (ou de réhabilitation) pour la
      cible qui reçoit un nouveau membre est de 100 jours – le nombre de réussite du lanceur de sort.
    metadata_raw:
      - (Sort de magie altératrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
