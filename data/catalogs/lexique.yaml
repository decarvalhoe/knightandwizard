  - id: vol-magique
    term: Vol magique
    kind: sort
    school_raw: enchantement
    prose: >-
      Le mage incante, semblant tour à tour injurier à la terre et prier le ciel. Une brume turquoise se forme sous les
      pieds de la cible. Celle-ci peut dès lors s'envoler sans faire d'efforts physiques, se dirigeant de par sa simple
      pensée. Sa vitesse est de 1 mètre par seconde par réussite du lanceur de sort. Ce sort dure 10 minutes par niveau
      du magicien.
    metadata_raw:
      - (Sort d’enchantement)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:vol-magique
  - id: vol-magique-de-masse
    term: Vol magique de masse
    kind: sort
    school_raw: enchantement
    prose: >-
      Le mage incante, semblant tour à tour injurier à la terre et prier le ciel. Une brume turquoise se forme sous les
      pieds de ses cibles. Celles-ci peuvent dès lors s'envoler sans faire d'efforts physiques, se dirigeant de par
      leurs simples pensées. Leurs vitesses sont de 1 mètre par seconde par réussite du lanceur de sort. Ce sort dure 10
      minutes par niveau du magicien.
    metadata_raw:
      - (Sort d’enchantement)
