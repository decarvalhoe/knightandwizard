    kind: atout
    orientation: Magicien
    niveau: 2
    duration: ephemeral
    prose: >-
      L’énergie du magicien se manifeste autour de lui sous la forme et la couleur la plus proche de sa magie (par
      exemple, des éclairs courront sur un élémentaliste de foudre).
