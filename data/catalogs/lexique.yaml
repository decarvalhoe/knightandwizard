    term: Energie latente
    kind: atout
    orientation: Magicien
    niveau: 2
    duration: permanent
    prose: "Chaque fois que le personnage passe le niveau, son niveau en «\_Energie latente\_» multiplié par 3 est ajouté à ses points de sort."
