  - id: sables-mouvants
    term: Sables mouvants
    kind: sort
    school_raw: élémentaire
    prose: >-
      Le magicien désigne une zone des mains et les agite circulairement tout en remuant ses doigts comme s’il malaxait
      quelque chose. Il récite une formule magique et bientôt apparaît un champ de sable mouvant sur la zone désignée.
      La zone de sable mouvant créé s’étends sur 5 mètres2 par réussite du lanceur de sort. Un personnage pris dans ces
      sables mouvants doit réussir un jet de dextérité, avec un malus égal niveau du magicien, pour pouvoir s’extirper
      de ce piège. S’il échoue et que personne ne lui vient en aide, il s’enfoncera inexorablement jusqu’à être
      totalement submergé de boue et donc mourir d’asphyxie. Si quelqu’un vient à tenter de le sortir (par exemple en
      lui laçant une corde), cette personne doit faire un jet de force avec un malus à sa difficulté égale au niveau du
      magicien. Notez qu’en réalité, les sables mouvants sont incapables d’aspirer qui que ce soit entièrement du fait
      de leurs masses. Ce sort représente plutôt la vision cinématographie du phénomène.
    metadata_raw:
      - (Sort de magie élémentaire)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:sables-mouvants
