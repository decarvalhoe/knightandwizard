  - id: squelette-illusoire
    term: Squelette illusoire
    kind: sort
    school_raw: illusoire
    prose: >-
      Le magicien ferme les yeux et pense à un corps squelettique. Sa bouche se met à murmurer une formule tandis que
      ses mains semblent façonner un corps de terre glaise. Dans ses bras apparaît alors un squelette illusoire.
      Celui-ci reste 10 minutes par niveau du lanceur. Cette illusion peut être masculine ou féminine et peut avoir
      vêtement et équipement à sa disposition. La description de l’illusion revient au magicien. Son nombre de réussite
      influera sur la qualité de son résultat.
    metadata_raw:
      - (Sort de magie illusoire)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
