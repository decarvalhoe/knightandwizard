  - id: soudure
    term: Soudure
    kind: sort
    school_raw: altératrice
    prose: >-
      Le magicien pointe ses deux indexes en direction de deux matériaux appliqués les un contre les autres. Il décrit
      de petites vagues en longeant la faille. Des rayons rouge éblouissant jaillissent de ses doigts et soudent les
      deux matériaux entre eux pendant qu’il prononce la formule du sort. Il n’y a pas besoin que ce soit des matériaux
      de même nature mais les matériaux ne doivent pas être vivants. Les matériaux vont se souder entre eux. La soudure
      peut se faire sur une longueur maximale de 1 mètre par réussite obtenue par le magicien lorsque le sort à été
      lancé. Pour briser cette attache, 1 réussite en force est nécessaire par niveau du magicien.
    metadata_raw:
      - (Sort de magie altératrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:soudure
