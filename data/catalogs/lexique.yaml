  - id: instinct-de-reproduction
    term: Instinct de reproduction
    kind: sort
    school_raw: naturelle
    prose: >-
      Le magicien regarde sa cible dans les yeux et agite une main tremblotante dans les airs en tout en récitant une
      formule secrète. Les instincts primaires de reproduction de la cible ressortent alors au grand jour. La cible du
      sort, pour ne pas être affectée, doit faire un jet de volonté, avec un malus à sa difficulté égal au nombre de
      réussites obtenue par le lanceur de sort. Si elle échoue à ce jet, ses instincts prendront (plus ou moins en
      fonction de son jet) le dessus sur elle. Cet état dure 10 minutes par niveau du magicien.
    metadata_raw:
      - (Sort de magie naturelle)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:instinct-de-reproduction
