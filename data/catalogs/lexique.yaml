  - id: vol-de-secret
    term: Vol de secret
    kind: unknown
    duration: ephemeral
    prose: >-
      Le personnage peut entendre pendant 1 minute par niveau ce qu’un autre personnage se dis mentalement. Il peut
      également voir les images que celui-ci s’imagine. Toutefois, pour pénétrer le mental de quelqu'un, le personnage
      utilisant cet atout doit vaincre sa cible sur un jet d’intelligence réciproque (difficulté de 7). Sa cible doit
      être à porter de vue.
    metadata_raw:
      - (Ephémère)
    source_refs:
