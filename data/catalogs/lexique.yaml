  - id: aube-meurtriere
    term: Aube meurtrière
    kind: unknown
    prose: Les rayons de soleil brûlent le personnage comme le feraient des flammes. (permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
