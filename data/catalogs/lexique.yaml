  - id: barriere-de-holn
    term: Barrière de Höln
    kind: sort
    school_raw: blanche
    prose: >-
      Le magicien se concentre en faisant de lent mouvement ésotérique. Derrière ses doigts, des lignes dorées se
      dessinent dans les airs avant de disparaître comme ils sont apparus. Puis soudain, joignant les deux bras,
      l’incantateur indiquera une direction. De ceux-ci sortiront des milliers de fils d’or qui se tisseront d’eux-mêmes
      comme un filet de pêche barrant le chemin à l’endroit choisit par le lanceur.  Cette barrière ne peut être
      franchie par un cœur mauvais. Ce sort dure dix minutes par niveau du lanceur de sort et peut faire au maximum un
      mètre carré par réussite. Si en se construisant, la barrière rencontre un obstacle (par exemple un mur) alors
      celle si se soudera à celui-ci stoppant ainsi sa croissance de ce coté là.
    metadata_raw:
      - (Sort de magie blanche)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:barriere-de-holn
  - id: barriere-psychique
    term: Barrière psychique
    kind: sort
    school_raw: abjuratrice
    prose: >-
      Le magicien se frotte les mains l’une contre l’autre, bien à plat en parlant très vite. Une poussière jaune
      étincelante apparaît alors au-dessus de la tête de la cible et lui ruisselle dessus. Le sujet est protégé contre
      les sorts tentant de pénétrer son esprit, ses pensées, ses rêves, … bref, tout ce qui touche à son cerveau. La
      poussière diminue de 1 par réussite, les réussites d’un sort visant le mental de la cible. La poussière créée
      reste active 1 jour par niveau du lanceur (néanmoins celle-ci n’est plus visible quelques secondes après s’être
      dispersée).
    metadata_raw:
      - (Sort de magie abjuratrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:barriere-psychique
  - id: barriere-psychique-de-masse
    term: Barrière psychique de masse
    kind: sort
    school_raw: abjuratrice
    prose: >-
      Le magicien se frotte les mains l’une contre l’autre, bien à plat en parlant très vite. Une poussière jaune
      étincelante apparaît alors au-dessus des têtes des cibles choisies par le lanceur de sort et leur ruisselle
      dessus.Les sujets sont alors protégés contre les sorts tentant de pénétrer leurs esprits, leurs pensées, leurs
      rêves, … bref, tout ce qui touche à leurs cerveaux. La poussière diminue de 1 par réussite, les réussites d’un
      sort visant le mental de la cible. La poussière créée reste active 1 jour par niveau du lanceur (néanmoins
      celle-ci n’est plus visible quelques secondes après s’être dispersée).
    metadata_raw:
      - (Sort de magie abjuratrice)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
        sha256: 41ac70aa0fecf82fef9862628a1d8efec7886a0fd91c7df32ee27bc0cd4c7332
        ref: entry:barriere-psychique-de-masse
  - id: beaute-desarmante
    term: Beauté désarmante
    kind: atout
    niveau: 4
    duration: permanent
    prose: >-
      Le personnage radie d’une telle beauté que si quelqu’un (qui pourrait être attiré par lui) désire lui nuire,
      celui-ci doit faire un jet de volonté en le voyant avec une difficulté supplémentaire égale à l’esthétique – 5 du
      personnage possédant l’atout. Cet atout ne peut être choisi que par un personnage possédant un score minimum de 5
      en esthétique.
    metadata_raw:
      - (Permanent)
      - (Atout de niveau 4)
    source_refs:
