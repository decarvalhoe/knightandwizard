  - id: reconnaissance-du-guerrier
    term: Reconnaissance du guerrier
    kind: unknown
    duration: permanent
    prose: >-
      Lorsque les yeux du personnage croisent ceux d’un autre guerrier, le niveau de celui-ci peut alors lui être
      révélé.
    metadata_raw:
      - (Permanent)
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
