    term: Permanent
    kind: unknown
    prose: >-
      Ce terme désigne les atouts et handicap illimités ou qui s’appliquent automatiquement. Aucune nuit de sommeil
      n’est requise pour pouvoir se servir de ces atouts.
    source_refs:
      - path: data/legacy/paper/regles-papier/extracted/listes/lexique.md
