  - id: nettoyage-magique
    term: Nettoyage magique
    kind: sort
    school_raw: enchanteresse
    prose: >-
      Le magicien tend le doigt, se met sur la pointe du pied droit et fait un tour sur lui-même vers sa gauche. Un
      faisceau turquoise parcours l'endroit (le plus souvent une pièce). La poussière et toutes les saletés présentent
      disparaissent au fur et à mesure que le magicien tourne sur lui-même. Ce sort nettoie une zone s’étendant sur un
      rayon de 3 mètre par réussite obtenue autour du lanceur de sort.
    metadata_raw:
      - (Sort de magie enchanteresse)
    source_refs:
