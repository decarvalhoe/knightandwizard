  - id: animation-des-armures
    term: Animation des armures
    kind: sort
    school_raw: enchanteresse
    prose: >-
      Le magicien désigne une armure ou pièce d’armure du bras et incante tout en faisant de rapide mouvement des
      doigts. L’armure se met alors à bouger comme si quelqu’un la portait. Le magicien peut alors diriger les
      mouvements des pièces animées. L’animation est active sur 1 pièce d’armure par réussite obtenue. Ce sort reste
      actif 10 minutes par niveau du lanceur.
    metadata_raw:
      - (Sort de magie enchanteresse)
