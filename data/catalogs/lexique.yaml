  - id: sol-fertile
    term: Sol fertile
    kind: sort
    school_raw: naturelle
    prose: >-
      Le magicien fait semblant de plonger sa main dans une bourse accrochée à sa ceinture Il prend une pleine poignée
      de fertilité et fait mine de la réprendre sur le sol, à la manière d'un paysan semant son champ de blé. Des
      microorganismes et des éléments nutritifs afflueront des alentours pour remplir les conditions nécessaires à
      rendre le sol fertile sur un rayon de 3 mètres par niveau du lanceur s’étendant autour de ce dernier. Notez bien
      que ce sort n'irrigue pas la terre et ne plante pas de graine. Il rend juste la terre idéale pour la croissance
      des plantes.
    metadata_raw:
      - (Sort de magie naturelle)
