  - id: reveil-de-la-bete
    term: Réveil de la bête
    kind: sort
    school_raw: naturelle
    prose: >-
      Le magicien agite ses doigts en direction de d’une cible tout en plongeant son regard dans ses yeux. Il récite une
      formule étrange qui selon la cible aura où non des effets. Si la cible est une créature change forme (tel qu’un
      loups garou par exemple), elle se transformera automatique en sa forme bestiale, révélant ainsi sa vrai nature. Si
      la cible n’a rien à cacher, alors rien ne se passera. La cible peut pour résister à la transformation faire un jet
      de volonté avec comme malus le nombre de réussite du magicien. L’état de transformation dure 10 minutes par niveau
      du lanceur de sort.
    metadata_raw:
      - (Sort de magie naturelle)
    source_refs:
