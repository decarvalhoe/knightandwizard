  - id: reflexes-fulgurants
    term: Réflexes fulgurants
    kind: atout
    orientation: Guerrier
    niveau: 4
    duration: permanent
    prose: >-
      Cet atout supprime la difficulté supplémentaire (de +1) lors d’un jet de réflexe. Cet atout peut être choisit à
      condition de posséder un score en réflexes minimum de 4.
    metadata_raw:
      - (Permanent)
      - "(Atout de niveau 4 de l’orientation\_: Guerrier)"
