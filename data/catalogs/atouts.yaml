    effect: >-
      Le personnage n’oublie pas les ennemis qu’il a combattus et apprend de fois en fois un peu plus sur leurs
      techniques de combat respectives. Le personnage gagne un bonus de 1 sur les jets de dès qui entre en opposition
      avec ceux de son adversaire, pour chaque combat qu’il a déjà mené avec celui-ci. Ces points des bonus sont limités
      au score de connaissance de l’ennemi du personnage. Par exemple un personnage avec un score de 3 en connaissance
      de l’ennemi, qui a déjà combattu deux fois le même adversaire aura à présent une difficulté baissée de 2 lorsqu’il
      combattra à nouveau contre lui. Puis, cette difficulté sera baissée de 3 et ne montera pas plus haut tant que le
      niveau du personnage en « Connaissance de l’ennemi » ne dépasse pas 3.
