  - id: niveau-5-polyvalence
    name: Polyvalence
    status: active
    effect: >-
      Le personnage peut désormais choisir ses les atouts de niveaux dans toutes les orientations (les classes et les
      conditions demeurent restrictives) jusqu’à un niveau égal à son nombre de point en « Polyvalence » + 1. Cet atout
      compte comme atout à part entière et ne permet de choisir un autre atout lorsqu’on l'acquière. Par exemple, si un
      guerrier niveau 5 choisit cet atout. Il pourra donc, quand il passera niveau 6, prendre un atout d’artiste niveau
      2 (Polyvalence : 1 + 1). Il devra reprendre l’atout « Polyvalence » s’il désire accéder aux atouts de niveau 3 des
      orientations qui ne sont pas la sienne. Néanmoins, il ne pourra pas choisir l’atout « Musique stimulante » qui est
      réservé aux bardes car la polyvalence permet juste d’annuler la barrière des orientations.
    value: 5000
    activation: permanent
    scope: niveau
    source_refs:
