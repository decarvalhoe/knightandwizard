  - id: niveau-6-telekinesie-intellectuel
    name: Télékinésie
    status: active
    effect: >-
      Le personnage peut soulever et déplacer de la matière solide dans les airs (les liquides et gazeux ne sont donc
      pas inclus). Pour se faire, le personnage doit s'aider au moins une de ses main et se concentrer sur la cible
      qu'il souhaite déplacer. La vitesse maximale est égale au niveau du magicien en km/h. Le poids maximal déplacé est
      de 1kg/niveaux. Enfin, pour mouvoir un objet, le personnage doit l'avoir vu au préalable et celui-ci doit se
      trouver dans un rayon de 1 m/niv. du personnage. Si un jet est requis au travers d'une manipulation télékinésique,
      alors l'Intelligence substituera la Force et la Perception remplacera la Dextérité pour les aptitudes. Les
      compétences restent inchangées.
    value: 6000
    activation: permanent
    scope: niveau
