  - id: niveau-7-perception-des-energies-magicien
    name: Perception des énergies
    status: active
    effect: >-
      Le personnage peut à tout moment « enclenché » sa perception des énergies. La couleur de ses iris peut alors
      changer. Le magicien percevra alors le monde de façon différente. Cet atout lui donne le don de percevoir
      l'énergie pure. Le magicien qui en est doté voit des brumes colorées scintillantes teintées de la couleur de la
      magie en question, un peu comme des aurores boréales. Il pourra estimer les stocks d'énergie dans un lieu,
      percevoir les fortes concentrations d'une énergie, mais il a aura aussi la capacité de voir les mouvements, les
      variations d'énergie. Si un sort est lancé, il pourra estimer la quantité d'énergie nécessaire pour le lancer, la
      localisation du lanceur et la nature de l'énergie utilisée (la couleur).
    value: 7000
    activation: permanent
    scope: niveau
    source_refs:
