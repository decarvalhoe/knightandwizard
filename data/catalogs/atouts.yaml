  - id: niveau-12-hybridation-du-familier-magicien
    name: Hybridation du familier
    status: active
    effect: >-
      Lors de l'acquisition de cet atout, le magicien doit choisir une partie du corps de son familier (ex. un bras, les
      yeux, la peau, ...). Une fois le familier rappeler dans son magicien, ce dernier pourra modifier sa propre forme
      en substituant la zone corporelle choisie par celle de son familier. Le nouveau membre peut être un simple ajout
      (ex. un humain peut obtenir les ailes de son familier dragon). Le nouveau membre possède toutes les atouts liés à
      cette zone du corps du familier mais ne modifie ni les points de vitalité, ni le facteur de vitesse du magicien.
      Cet atout peut être cumulé avec des zones du corps diverses ou similaire. Le magicien ne peut choisir de
      substituer sa propre tête.
    value: 12000
    activation: ephemere
    scope: niveau
    source_refs:
