  - id: niveau-7-repulsion-magicien
    name: Répulsion
    status: active
    effect: >-
      Le personnage arrive à canaliser son énergie pour la libérer dans une direction bien précise. Généralement c’est
      de la paume de la main que sors cette force invisible qui repousse les corps. La portée de cette force (comparable
      à celle d’un vent) est de 1 mètre par niveau du magicien. Tout personnage pris dans la répulsion doit faire un jet
      de force pour ne pas être repoussé. La difficulté du jet de force est de 1 par point d’énergie dépensé. Donc si un
      magicien dépense 7 point d’énergie, la difficulté du jet sera de 7.
    value: 7000
    activation: permanent
