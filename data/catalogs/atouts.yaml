  - id: niveau-15-maitrise-de-l-energie-magicien
    name: Maîtrise de l’énergie
    status: active
    effect: >-
      Cet atout modifie l’atout « Energie à l’honneur » de la manière suivante : Le personnage teint l’air qui l’entoure
      de la couleur de sa magie dans un rayon égal à son niveau en mètre. Cette couleur est nettement plus intense que
      dans le simple « Energie à l’honneur ». Dans cet environnement les sorts de la couleur maîtrisées voient leurs
      difficultés baissées de 1 pendant 10 minutes/niveau. Ce bonus ne s’applique pas au magicien qui lui bénéficie d’un
      bonus égal à son niveau. Maîtriser une énergie prend 10DT non réductible. Cet atout modifie de manière permanente
      l’ « Energie à l’honneur » qui lui reste éphémère, ce qui signifie que passer d’un atout à l’autre n’amène pas de
      point supplémentaire dans l’atout.
    value: 15000
    activation: ephemere
    scope: niveau
