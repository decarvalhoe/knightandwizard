    name: Mobilisation post-mortem
    status: active
    effect: >-
      Lorsque le personnage fait un appel des morts, le nombre de revenant peut être au maximum de : son niveau X
      (mobilisation post-mortem + 1). Autrement dit, si un magicien ne possède pas cet atout, il relèvera son niveau au
      maximum de morts, s’il possède un points en mobilisation post-mortem, il relèvera 2X fois son niveau, puis trois
      fois s’il reprend à nouveau cet atout, et ainsi de suite.
