      prose: '3 points de vitalité en moins par réussite (douleur majeure).'
      ref: 'spells:douleur-majeure'
    spec:
      target: vitality
      op: sub
      value: '3 * successes'
      activation: active
      duration: ephemeral
      requires_mj_validation: true
    fidelity: pending
    ambiguity_ref: null
  douleur-mineure:
    source:
      prose: '1 point de vitalité en moins par réussite (douleur mineure).'
      ref: 'spells:douleur-mineure'
    spec:
      target: vitality
      op: sub
      value: 'successes'
      activation: active
      duration: ephemeral
      requires_mj_validation: true
    fidelity: pending
    ambiguity_ref: null
  douleur-a-distance:
    source:
      prose: '2 points de vitalité en moins par réussite, à distance (3 m/niveau ; portée = ciblage).'
      ref: 'spells:douleur-a-distance'
    spec:
