  # --- Contrôle / charme / peur (target status, E2h, PENDING) ---
  # Le `scope` porte l'id de statut appliqué ; le jet de résistance (intelligence / volonté / force)
  # est noté en prose — son ENFORCEMENT (jet opposé) relève de la couche d'application (E3/E4),
  # pas encore câblé. `value: 1` = application du statut (placeholder requis par le schéma).
  controle-mental:
    source:
      prose: 'Contrôle mental, 10 min/niveau. Résistance : test d’intelligence (enforcement différé).'
      ref: 'spells:controle-mental'
    spec:
