# E2n — Overlay d'effets structurés AUTHORÉS, école altération.
#
# Source autorité : la ligne `effect` du grimoire (spells.yaml). PROPOSÉ, **À VALIDER par le MJ**
# (règles vivantes, Q-D8.2) : `fidelity: pending` + `spec.requires_mj_validation: true`.
#
# AXE TRANSFORM PROVISOIRE : polymorphes, pétrification, taille et augmentations corporelles sont
# place-holdées via `target: status` (scope = forme/partie). C'est une approximation : un vrai
# polymorphe REMPLACE la créature (stats/aptitudes) — un sous-système « transformation » dédié
# reste à concevoir. Les jets de résistance (« Contre jet d'endurance ») sont notés en prose ;
# enforcement différé. `value: 1` = application (placeholder requis).
#
# NON inclus (matière/destruction/narratif) : changer-l-eau-en-vin, chatiment-de-la-matiere,
# corrosion(-de-masse), evaporation, gel, soudure (transmutation de matière, quantité/R) ;
# membre-telescopique (allongement narratif) ; rendre-forme (dissipe une transformation = méta).
#
# Mergé dans spells.yaml (champ `effect_model`) par `tools/link-spell-effects.ts`.
version: 1
school_id: alteration
effects:
  # --- Polymorphes (transform via status ; résistance endurance) ---
  changement-de-sexe:
    source:
      {
        prose: 'Change le sexe de la cible. Résistance : contre jet d’endurance (enforcement différé).',
        ref: 'spells:changement-de-sexe'
      }
    spec:
      {
        target: status,
        scope: 'transformed:sexe',
        op: grant,
        value: 1,
        activation: active,
        duration: until_dispel,
        requires_mj_validation: true
