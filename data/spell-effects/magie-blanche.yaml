# E2c — Overlay d'effets structurés AUTHORÉS, école magie-blanche.
#
# Source autorité : la ligne `effect` du grimoire (spells.yaml) + la prose liée (lexique, E0).
# PROPOSÉ par audit (E2a/E2c), **À VALIDER par le MJ** (méthode Q-D8.2) : `fidelity: pending` +
# `spec.requires_mj_validation: true`. Tant que non validé, ce n'est PAS du canon autoritaire.
#
# Conventions (buffs templatables) :
#   - "+N de vitalité/R"      → target vitality, op add, value "N * successes"   (soin instantané, ephemeral)
#   - "Attribut +1/R, 10 min/niv" → target aptitude, scope <attr>, op add, value "successes",
#       durée narrative { amount: "level * 10", unit: minute }
#   - "Diff. –1/R, 10 min/niv" → target difficulty, op sub, value "successes"    (bénédiction, global)
#   - "Facteur … -1/R"        → target factor, scope speed|will, op sub, value "successes"
#   - Les variantes "-de-masse" portent le MÊME effet par cible ; le "1 perso/R" est un ciblage (à part).
#
# NON inclus (arbitrage / cible à décider) : bouclier* (buff d'armure P/E/C/T — cible EffectModel à
# trancher), deviation* (ambigu), lumiere/purification*/respiration* (utilitaire narratif),
# resurrection, don-d-energie, barriere-de-holn, renvoi-du-demon, deviation-des-projectiles.
#
# Mergé dans spells.yaml (champ `effect_model`) par `tools/link-spell-effects.ts` (catalogs:build:magic).
