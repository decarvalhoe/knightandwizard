# E2d — Overlay d'effets structurés AUTHORÉS, école magie-blanche.
#
# Source autorité : la ligne `effect` du grimoire (spells.yaml) + la prose liée (lexique, E0).
# Buffs/soins/facteurs/bénédiction : **VALIDÉS par le MJ le 2026-05-28** (E2d) → `fidelity: covered`.
# Famille `bouclier*` : **ajoutée en E2f** (target `protection`) → `fidelity: pending` +
# `requires_mj_validation` (à valider plus tard via les règles vivantes). Rulings E2d :
#   - Buffs d'aptitude « +1/R » = `value: successes` (barème par réussite confirmé).
#   - `courage` : le facteur de volonté **plus bas** = meilleure réussite au test ; donc « –1/R »
#     (`op: sub`) est bien bénéfique (cf. R-8.19, sens du test confirmé par le MJ).
#   - Soins `guerison-de-la-*` : **soins par zone, HORS combat** → `scope: zone` (gating combat =
#     couche d'application, E3). `guerison-absolue` reste un soin général.
#
# Conventions :
#   - "+N de vitalité/R"      → target vitality, op add, value "N * successes"   (soin instantané)
#   - "Attribut +1/R, 10 min/niv" → target aptitude, scope <attr>, op add, value "successes",
#       durée narrative { amount: "level * 10", unit: minute }
#   - "Diff. –1/R, 10 min/niv" → target difficulty, op sub, value "successes"    (bénédiction, global)
#   - "Facteur … -1/R"        → target factor, scope speed|will, op sub, value "successes"
#   - "Bouclier de +N <type>/R" → target protection, scope all|<élément>|demon, op add, "successes" (E2f)
#   - Les variantes "-de-masse" portent le MÊME effet par cible ; le "1 perso/R" est un ciblage (à part).
#
# NON inclus (arbitrage / cible à décider) : deviation* (ambigu), lumiere/purification*/respiration*
# (utilitaire narratif), resurrection, don-d-energie, barriere-de-holn, renvoi-du-demon,
# deviation-des-projectiles.
#
# Mergé dans spells.yaml (champ `effect_model`) par `tools/link-spell-effects.ts` (catalogs:build:magic).
