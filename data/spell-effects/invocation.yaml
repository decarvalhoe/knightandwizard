# E2i — Overlay d'effets structurés AUTHORÉS, école invocation.
#
# Source autorité : la ligne `effect` du grimoire (spells.yaml). PROPOSÉ, **À VALIDER par le MJ**
# (règles vivantes, Q-D8.2) : `fidelity: pending` + `spec.requires_mj_validation: true`.
#
# Convention (invocation d'entité) :
#   - "N <créature>/R" → target summon, scope <slug créature>, op grant, value "N * successes"
#     (singles : "successes" ; nuées de 10 : "10 * successes"). duration until_dispel (persiste
#     jusqu'à révocation ; cf. sort `revocation`). L'instanciation (stats depuis le bestiaire) est
#     différée à la couche d'application.
#   - `scope` vise un slug du bestiaire (à réconcilier lors de la validation).
#
# NON inclus (méta) : lien-d-invocation (crée un lien magicien↔cible, jet d'intelligence),
# revocation (révoque une entité invoquée) — mécaniques méta-invocation, à modéliser à part.
#
# Mergé dans spells.yaml (champ `effect_model`) par `tools/link-spell-effects.ts`.
version: 1
school_id: invocation
effects:
  invocation-d-elfe:
    source: { prose: 'Invoque 1 elfe par réussite.', ref: 'spells:invocation-d-elfe' }
    spec:
      {
        target: summon,
        scope: elfe,
        op: grant,
        value: 'successes',
        activation: active,
        duration: until_dispel,
        requires_mj_validation: true
      }
    fidelity: pending
    ambiguity_ref: null
