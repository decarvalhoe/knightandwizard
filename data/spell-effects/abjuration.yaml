# E2l/E2m — Overlay d'effets structurés AUTHORÉS, école abjuration.
#
# Source autorité : la ligne `effect` du grimoire (spells.yaml). PROPOSÉ, **À VALIDER par le MJ**
# (règles vivantes, Q-D8.2) : `fidelity: pending` + `spec.requires_mj_validation: true`.
#
# E2l : les rares effets de DÉGÂTS d'abjuration (sur lanceurs/familiers).
# E2m : famille ANTI-MAGIE (méta-magie) via la cible `spell` (axe PROVISOIRE) : `scope` = aspect visé
#   (école/couleur ciblée pour `contre-*`, `difficulty`, `energy`, `active`) ; `op`/`value` = magnitude.
#   « Annule un sort <couleur>/R » → target spell, scope = école ciblée, op sub, value successes.
#   La résolution méta (interaction avec le moteur de sorts) est un sous-système à concevoir.
#   Couleur→école (R-8.3) : blanc=magie-blanche, bleu=elementaire, brun=divination, gris=necromancie,
#   jaune=abjuration, noir=magie-noire, orange=invocation, rouge=alteration, turquoise=enchantement,
#   vert=magie-naturelle, violet=illusion.
# NON inclus (méta hétérogène/narratif) : annihilation (champ anti-magie), boomerang (renvoi),
#   deplacement-magique (change la cible), irreductibilite (empêche réduction TI), interdiction-magique
#   (oubli de sort), perturbation (concentration), barriere-psychique (résistance mentale),
#   detournement-du-lien-du-mort-vivant.
#
# Mergé dans spells.yaml (champ `effect_model`) par `tools/link-spell-effects.ts`.
