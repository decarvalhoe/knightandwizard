      }
    spec:
      {
        target: vitality,
        op: sub,
        value: '2 * successes',
        activation: active,
        duration: ephemeral,
        requires_mj_validation: true
      }
    fidelity: pending
    ambiguity_ref: null
  crane-hurlant:
    source:
      {
        prose: '2 dégâts de feu par réussite (+ effet de peur, noté à part).',
        ref: 'spells:crane-hurlant'
      }
    spec:
      {
        target: damage,
        scope: feu,
        op: add,
        value: '2 * successes',
        activation: active,
        duration: ephemeral,
        requires_mj_validation: true
      }
    fidelity: pending
    ambiguity_ref: null
  putrefaction:
    source:
      {
        prose: 'Putréfaction : 1 dégât par réussite et par jour, pendant 1 jour par niveau (DoT ; tick quotidien noté).',
        ref: 'spells:putrefaction'
      }
    spec:
      {
        target: vitality,
        op: sub,
        value: 'successes',
        activation: active,
        duration: { amount: 'level', unit: day },
        requires_mj_validation: true
      }
    fidelity: pending
    ambiguity_ref: null
