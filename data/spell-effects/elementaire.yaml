# E2b — Overlay d'effets structurés AUTHORÉS, école élémentaire.
#
# Source autorité : la ligne `effect` du grimoire (spells.yaml) + la prose liée (lexique, E0).
# Chaque entrée est un EffectModel complet (rules-core), PROPOSÉ par audit (E2a) et **À VALIDER par
# le MJ** (méthode Q-D8.2) : `fidelity: pending` + `spec.requires_mj_validation: true`. Tant que non
# validé, ce n'est PAS du canon autoritaire — jamais confondu avec un effet validé.
#
# Convention de dégâts élémentaires (R-8.15, couche élémentaire ≠ P/E/C/T physique) :
#   - `target: damage`, `scope` = élément (feu | foudre | eau) → routé par le moteur de résistance (E4).
#   - "N dégâts/R"            → value: "N * successes"            (N par réussite)
#   - "N dégâts +M par R sup" → value: "N + M * (successes - 1)"  (base N, +M par réussite au-delà de la 1re)
#   - "foudre" normalise "foudre" ET "électricité" (même élément).
#
# Mergé dans spells.yaml (champ `effect_model`) par `tools/link-spell-effects.ts` (catalogs:build:magic).
